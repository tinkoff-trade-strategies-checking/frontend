openapi: 3.1.0
info:
  title: Т-Инвестиции — тренажёр и лаборатория стратегий, REST и SSE
  version: 1.0.0
  summary: Контракт REST и SSE первой версии backend (арена, запуск, отчёт, история, воспроизведение, вход)
  description: |
    Contract-first: источник правды — этот файл (`backend/api/openapi.yaml`).
    Команды — REST, события — SSE. Деньги — десятичные строки (INV-6).
    В слепом режиме ответы не содержат тикеров, названий, рублёвых сумм, реальных дат и
    внутренних метрик подбора периода (`sigma`, `mdd`, `p33`, `p80`) (INV-1, INV-7).
    Идентификаторы: хранимые сущности (сессии, прогоны, стратегии, пользователи, заявки) — UUID v7 (`Uuid`);
    сущности, пересчитываемые из журнала (исполнения, сделки, расхождения), — детерминированный UUID v5
    от (сессия, вид, номер в ядре) (`DerivedUuid`), поэтому id стабилен между снимком и SSE (INV-8).
    В слепом режиме бумага адресуется только `paperIndex` (индекс бумаги в сессии, как `instrument_index` ядра),
    никаких `paperId`, ключа или тикера (INV-7); в раскрытом режиме — `paperId` из каталога (`LaunchPaper.id`).
    Необязательные поля отчёта и истории — `null`, а не пропуск.
    Производные величины (проценты портфеля, позиций и сделок, издержки, `changePct`, кривая просадки, длительность
    просадки в днях) считает core (core#54), backend только передаёт результат без арифметики; проценты уже ×100.
    Они есть всегда. `null` остаётся у `changePct` бумаги без бара на курсоре, а также у полей фонового алгоритма
    для старых сессий без привязанного алгоритма (до ФТ-18…20).

    CSRF (Spring Security, cookie-токен). Токен — cookie `XSRF-TOKEN` (без HttpOnly, его читает Angular),
    клиент без токена получает его из ответа `GET /me`, в том числе из `401`. Заголовок `X-XSRF-TOKEN`
    обязателен на всех изменяющих запросах, включая `POST /auth/login` и `POST /auth/logout`; без него или
    при неверном токене — `403`. После входа токен и cookie `SESSION` меняются: клиент берёт новый `XSRF-TOKEN`
    из ответа входа. Ошибки: `400` — битое тело, нарушенный формат или не-UUID в пути; `403` — CSRF;
    чужая сессия даёт тот же `404`, что и несуществующая (перебор id невозможен); `503` — воркер ядра недоступен.
    В слепой сессии `detail` и `instance` ошибок не содержат дат, тикеров и названий (INV-7): параметры
    передаются полями (`field`, `barsCount`, `maxBars`).
servers:
  - url: /api/v1
    description: API v1 (относительно домена приложения за Caddy)
tags:
  - name: identity
    description: Учётные записи, вход и текущая сессия
  - name: marketdata
    description: Каталог бумаг и параметры запуска
  - name: workshop
    description: Мастерская алгоритмов — каталог, черновики, проверка, публикация, форк, видимость
  - name: simulation
    description: Прогоны алгоритмов на истории, очередь, SSE, повтор
  - name: sessions
    description: 'Ручная торговля — сессии, плеер, заявки, SSE, воспроизведение'
  - name: analysis
    description: Отчёты и история
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: Вход по почте и паролю
      description: |
        Создаёт cookie-сессию (`SESSION`, HttpOnly; Secure; SameSite=Lax) и устанавливает новую
        CSRF-cookie `XSRF-TOKEN` (без HttpOnly) для Angular `HttpClientXsrfModule`.
        Вход защищён от CSRF: заголовок `X-XSRF-TOKEN` обязателен, токен клиент получает из `GET /me`
        (в том числе из ответа 401). После входа токен и идентификатор сессии меняются.
        Неизвестная почта и неверный пароль дают одинаковый ответ 401.
      security:
        - xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204':
          description: Сессия создана, cookies `SESSION` и `XSRF-TOKEN` установлены
          headers:
            Set-Cookie:
              description: Cookies `SESSION` и `XSRF-TOKEN`
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: Выход
      description: Закрывает сессию; требует `X-XSRF-TOKEN`. Новый токен клиент получает следующим `GET /me`.
      security:
        - sessionCookie: []
          xsrfToken: []
      responses:
        '204': { description: Сессия закрыта }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Текущий авторизованный пользователь
      description: |
        Возвращает профиль пользователя. Всегда (и при 200, и при 401) выставляет cookie `XSRF-TOKEN`,
        так анонимный клиент получает токен для входа.
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
          headers:
            Set-Cookie:
              description: Cookie `XSRF-TOKEN`
              schema: { type: string }
        '401':
          description: Не авторизован; ответ всё равно выставляет cookie `XSRF-TOKEN`
          headers:
            Set-Cookie:
              description: Cookie `XSRF-TOKEN`
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /launch/options:
    get:
      tags: [marketdata]
      operationId: getLaunchOptions
      summary: Параметры экрана запуска
      responses:
        '200':
          description: Допустимые значения и умолчания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchOptions' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/ArchiveUnavailable' }
  /papers:
    get:
      tags: [marketdata]
      operationId: listAvailablePapers
      summary: Бумаги, доступные для выбора при запуске со своей датой
      responses:
        '200':
          description: Каталог бумаг
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LaunchPaper' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/ArchiveUnavailable' }
  /papers/{ticker}/fundamentals:
    get:
      tags: [marketdata]
      operationId: getPaperFundamentals
      summary: Последний доступный срез фундаментальных показателей бумаги
      description: |
        Возвращает последний снимок фундаментальных показателей по тикеру для экрана запуска (выбор бумаги в
        неслепом режиме). Если данных по тикеру нет, возвращает `200` с `available: false` и `snapshot: null`.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Тикер бумаги MOEX (например, `SBER`)
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        '200':
          description: 'Фундаментальные показатели бумаги (или `available: false`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperFundamentalsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
  /instruments/bonds:
    get:
      tags: [marketdata]
      operationId: listBonds
      summary: Справочник облигаций MOEX (ОФЗ и корпоративные выпуски)
      description: |
        Возвращает список доступных облигаций MOEX (ОФЗ и корпоративные выпуски) с номиналом, ставкой и размером
        купона, датами ближайшего купона, погашения и оферты, НКД, YTM, дюрацией и признаком амортизации (INV-6).
      responses:
        '200':
          description: Список облигаций
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BondSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /instruments/bonds/{ticker}/calc:
    get:
      tags: [marketdata]
      operationId: calculateBond
      summary: Расчёт цены, НКД, текущей доходности и YTM облигации
      description: |
        Точный расчёт на `BigDecimal` (INV-4, INV-6): чистая и грязная цена в рублях, НКД, текущая доходность и
        эффективная доходность к погашению (YTM) с учётом оставшегося графика купонов и амортизации номинала.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Тикер / ISIN облигации MOEX (например, `SU26238RMFS4`)
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: pricePct
          in: query
          required: false
          description: 'Цена облигации в % от номинала (например, `85.50`). Если не задана, используется справочная цена.'
          schema: { $ref: '#/components/schemas/Pct' }
        - name: asOfDate
          in: query
          required: false
          description: 'Дата расчёта в формате `YYYY-MM-DD`. Если не задана, используется текущая дата.'
          schema: { type: string, format: date }
      responses:
        '200':
          description: Результат расчёта облигации
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BondCalculationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/etfs:
    get:
      tags: [marketdata]
      operationId: listEtfs
      summary: Справочник БПИФ/ETF (включая фонды ликвидности под RUONIA), валют и драгметаллов
      description: |
        Возвращает список БПИФ/ETF MOEX (фонды ликвидности под RUONIA, индексные фонды акций и облигаций, золото),
        а также биржевых инструментов валютной секции и драгметаллов (INV-6).
      responses:
        '200':
          description: Список БПИФ/ETF, валют и драгметаллов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EtfSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /instruments/futures:
    get:
      tags: [marketdata]
      operationId: listFutures
      summary: Справочник фьючерсов MOEX ФОРТС
      description: |
        Возвращает список фьючерсных контрактов срочного рынка MOEX ФОРТС с шагом цены, стоимостью шага цены,
        гарантийным обеспечением (ГО), датой экспирации и типом исполнения (INV-6).
      responses:
        '200':
          description: Список фьючерсов ФОРТС
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FuturesSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /instruments/futures/{ticker}/calc:
    get:
      tags: [marketdata]
      operationId: calculateFutures
      summary: Расчёт вариационной маржи, ГО, ROE и плеча по фьючерсу ФОРТС
      description: |
        Точный расчёт на `BigDecimal` (INV-4, INV-6): вариационная маржа в рублях, совокупное гарантийное обеспечение
        (ГО), номинальная стоимость позиции, доходность на ГО (ROE, %) и эффективное плечо.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Код фьючерса MOEX ФОРТС (например, `SiH7`, `RIH7`)
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: entryPrice
          in: query
          required: false
          description: 'Цена входа в пунктах контракта. Если не задана, используется справочная последняя цена.'
          schema: { $ref: '#/components/schemas/Price' }
        - name: currentPrice
          in: query
          required: false
          description: 'Текущая цена в пунктах контракта. Если не задана, используется справочная последняя цена.'
          schema: { $ref: '#/components/schemas/Price' }
        - name: contracts
          in: query
          required: false
          description: 'Число контрактов (ненулевое целое: `> 0` — лонг, `< 0` — шорт; по умолчанию `1`).'
          schema: { type: integer, minimum: -100000, maximum: 100000, default: 1 }
        - name: asOfDate
          in: query
          required: false
          description: 'Дата расчёта в формате `YYYY-MM-DD`. Если не задана, используется текущая дата.'
          schema: { type: string, format: date }
      responses:
        '200':
          description: Результат расчёта позиции по фьючерсу
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuturesCalculationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/options:
    get:
      tags: [marketdata]
      operationId: listOptions
      summary: Справочник опционов MOEX ФОРТС
      description: |
        Возвращает список опционных контрактов Call/Put срочного рынка MOEX ФОРТС со страйком, датой экспирации,
        базовым активом, подразумеваемой волатильностью (IV) и гарантийным обеспечением (INV-6).
      responses:
        '200':
          description: Список опционов ФОРТС
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OptionSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /instruments/options/{ticker}/calc:
    get:
      tags: [marketdata]
      operationId: calculateOptionGreeks
      summary: Расчёт теоретической цены и греков опциона по Блэку — Шоулзу
      description: |
        Расчёт теоретической премии, внутренней и временной стоимости, а также греков опциона (Delta, Gamma,
        Theta в день, Vega на +1% IV, Rho на +1% ставки) по модели Black-Scholes-Merton (INV-6).
      parameters:
        - name: ticker
          in: path
          required: true
          description: Код опциона MOEX ФОРТС (например, `Si96000BC7`)
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: spot
          in: query
          required: false
          description: 'Цена базового актива. Если не задана, используется справочная цена базового актива.'
          schema: { $ref: '#/components/schemas/Price' }
        - name: volatilityPct
          in: query
          required: false
          description: 'Подразумеваемая волатильность (IV, % годовых, в (0, 500]). Если не задана, берётся из спецификации.'
          schema: { $ref: '#/components/schemas/Pct' }
        - name: riskFreeRatePct
          in: query
          required: false
          description: 'Безрисковая ставка (% годовых, в [0, 100]). Если не задана, берётся из спецификации.'
          schema: { $ref: '#/components/schemas/Pct' }
        - name: asOfDate
          in: query
          required: false
          description: 'Дата расчёта в формате `YYYY-MM-DD`. Если не задана, используется текущая дата.'
          schema: { type: string, format: date }
      responses:
        '200':
          description: Теоретическая цена и греки опциона
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptionGreeksResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/dividends:
    get:
      tags: [marketdata]
      operationId: listDividends
      summary: Календарь дивидендных выплат MOEX (режим расчётов T+1)
      description: |
        Возвращает список дивидендных событий MOEX с датой последнего дня покупки с дивидендами (`lastBuyDate`),
        датой дивидендного гэпа (`exDividendDate`, T+1), датой закрытия реестра (`recordDate`), датой выплаты,
        размером дивиденда на акцию, доходностью и оценкой дивидендного гэпа (INV-6). Опционально фильтруется по тикеру.
      parameters:
        - name: ticker
          in: query
          required: false
          description: 'Необязательный фильтр по тикеру MOEX (например, `SBER`, `LKOH`).'
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        '200':
          description: Список дивидендных событий
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DividendEventSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
  /instruments/dividends/{ticker}/calc:
    get:
      tags: [marketdata]
      operationId: calculateDividendPayout
      summary: Расчёт дивидендной выплаты, НДФЛ и дат отсечки T+1 по тикеру
      description: |
        Точный расчёт на `BigDecimal` (INV-4, INV-6) по последней отсечке выбранного тикера: грязная выплата,
        удерживаемый НДФЛ (13% или 15%), чистая выплата на счёт, даты `lastBuyDate` (T+1), `exDividendDate`,
        `recordDate` и оценка дивидендного гэпа.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Тикер акции MOEX (например, `SBER`, `LKOH`)
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: shares
          in: query
          required: false
          description: 'Количество акций в позиции (`>= 1`, по умолчанию `100`).'
          schema: { type: integer, minimum: 1, maximum: 10000000, default: 100 }
        - name: taxRatePct
          in: query
          required: false
          description: 'Ставка НДФЛ на дивиденды: `13` или `15` (% по умолчанию `13`).'
          schema: { type: integer, enum: [13, 15], default: 13 }
      responses:
        '200':
          description: Результат расчёта дивидендной выплаты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DividendPayoutResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/tax/calc:
    post:
      tags: [marketdata]
      operationId: calculateTax
      summary: Расчёт НДФЛ (13%/15%), сальдирования убытков и льгот ИИС (А / Б / ИИС-3)
      description: |
        Точный расчёт на `BigDecimal` (INV-4, INV-6): прогрессивная шкала НДФЛ РФ (13% до 2 400 000 ₽, 15% свыше),
        сальдирование убытков прошлых лет, освобождение торговой прибыли на ИИС-Б / ИИС-3 (дивиденды облагаются
        НДФЛ на всех типах счетов по НК РФ) и налоговый вычет на взносы по ИИС-А (до 400 000 ₽ в год).
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxCalculationRequest' }
      responses:
        '200':
          description: Результат налогового расчёта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalculationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /instruments/dca/calc:
    post:
      tags: [marketdata]
      operationId: calculateDca
      summary: Расчёт доходности портфеля с пополнениями и снятиями (DCA, TWR, XIRR)
      description: |
        Точный расчёт на `BigDecimal` и численном методе Ньютона — Рафсона / бисекции (INV-4, INV-6):
        совокупные пополнения и снятия, чистые вложения, прибыль, простая доходность, годовая денежно-взвешенная
        доходность (`xirrPct`, actual/365) и взвешенная по времени доходность (`twrPct`).
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DcaCalculationRequest' }
      responses:
        '200':
          description: Результат расчёта DCA (TWR и XIRR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DcaCalculationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /instruments/screener:
    get:
      tags: [marketdata]
      operationId: listScreenerPapers
      summary: Серверный скринер акций MOEX с фундаментальными мультипликаторами
      description: |
        Возвращает все доступные акции MOEX из активного каталога с левым объединением по последнему срезу
        `security_fundamentals` (капитализация, P/E, P/B, P/S, EV/EBITDA, ROE, чистая маржа, Debt/Equity,
        дивидендная доходность, Beta). Числовые значения передаются десятичными строками (INV-6).
      responses:
        '200':
          description: Список бумаг для скринера
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScreenerPaper' }
        '401': { $ref: '#/components/responses/Problem' }
  /instruments/events:
    get:
      tags: [marketdata]
      operationId: listMarketEvents
      summary: Календарь рыночных событий MOEX и ЦБ РФ
      description: |
        Возвращает календарь ключевых событий 2025–2026: заседания ЦБ РФ по ключевой ставке (`CBR_RATE`),
        отчётности МСФО/РСБУ (`EARNINGS`), дивидендные отсечки (`DIVIDEND`) и макростатистику (`MACRO`).
        Поддерживает фильтрацию по `type` и `ticker`.
      parameters:
        - name: type
          in: query
          required: false
          description: 'Необязательный фильтр по типу события.'
          schema: { $ref: '#/components/schemas/MarketEventType' }
        - name: ticker
          in: query
          required: false
          description: 'Необязательный фильтр по тикеру MOEX (например, `SBER`, `LKOH`).'
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        '200':
          description: Список рыночных событий, отсортированный по дате
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketEventSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
  /alerts:
    get:
      tags: [sessions]
      operationId: listAlerts
      summary: Список пользовательских алертов по цене и RSI
      description: Возвращает только алерты текущего авторизованного пользователя.
      responses:
        '200':
          description: Список алертов пользователя
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PriceAlertResponse' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [sessions]
      operationId: createAlert
      summary: Создать пользовательский алерт по цене или RSI
      description: |
        Создаёт новый активный алерт для текущего пользователя (лимит — не более 50 активных алертов на пользователя,
        при превышении возвращается 409 `CONFLICT`). Требует `SESSION` и `X-XSRF-TOKEN`.
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePriceAlertRequest' }
      responses:
        '201':
          description: Алерт создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceAlertResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
  /alerts/{id}:
    delete:
      tags: [sessions]
      operationId: deleteAlert
      summary: Удалить собственный алерт
      description: Удаляет алерт текущего пользователя. Чужой или несуществующий алерт возвращает 404.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '204':
          description: Алерт удалён
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
  /sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Создать ручную сессию
      description: |
        Подбор периода выбранной категории (`regime`) выполняет backend через `ClassifyPeriods` ядра.
        Поля `sigma`, `mdd`, `p33`, `p80`, а в слепом режиме также даты окна клиенту не передаются (INV-1, INV-7).
        Отказ — 422 с `LaunchProblem`, у которого `code` из `LaunchRejectReason`.
        Для `TOO_MANY_BARS` `maxBars` заполнен всегда. `barsCount` — число шагов шкалы сессии: точное по архиву для
        `custom`; при раннем отказе по длительности и шагу — нижняя оценка `durationDays × минимум свечей за день`;
        в слепом режиме (`random`), если лимит превышен у всех подобранных окон, `barsCount = null`: свойства скрытого
        периода не раскрываются (INV-7).
        Если доступных бумаг в пуле меньше `paperCount` (слепой режим), отказ — `INVALID_PARAMS` с `field = paperCount`; при подборе в слепом режиме приоритет у бумаг с сектором, при их нехватке набор дополняется бумагами без сектора.
        `startMode: random` создаёт слепую сессию, `custom` (своя дата) — неслепую.
        Подбор идёт через воркер: при его недоступности — 503.
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Параметры запуска отклонены
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LaunchProblem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}:
    get:
      tags: [sessions]
      operationId: getSessionSnapshot
      summary: Снимок сессии на текущем шаге
      description: |
        Идущая слепая сессия — `BlindSnapshot`; неслепая и завершённая слепая (данные раскрыты, INV-7) —
        `OpenSnapshot`; различаются по `mode`.
        После обрыва SSE или перезагрузки страницы клиент перечитывает снимок (INV-8).
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Снимок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/fundamentals:
    get:
      tags: [sessions]
      operationId: getSessionFundamentals
      summary: Фундаментальные показатели бумаг сессии на дату курсора (point-in-time)
      description: |
        Инвариант INV-7: для идущей слепой сессии (`blind && status == running`) возвращает
        `{ hiddenByBlindMode: true, asOfDate: null, items: [] }` без каких-либо данных бумаг.
        Инвариант INV-1: для открытой или завершённой (раскрытой) сессии возвращает только последний срез с
        `availableAt <= asOfDate` (дата бара на текущем курсоре), никогда не раскрывая будущую отчётность.
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Фундаментальные показатели бумаг сессии (или пустой маскированный ответ в слепом режиме)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionFundamentalsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/player:
    post:
      tags: [sessions]
      operationId: controlPlayer
      summary: Управление плеером ручной сессии
      description: |
        Единая операция управления временем сессии на сервере: `play`, `pause`, `step` (один шаг) и `speed` (`1`, `5`, `10`, `100`).
        При `action: step` дополнительно возвращает `stepResult` (и публикует событие `step` в SSE).
        `speed` обязателен при `action: speed`; при остальных действиях его нет или он `null` (число — 400).
        `Idempotency-Key` защищает `step` от двойного шага при повторе после обрыва сети.
        409 с кодом `PLAYER_STATE_CONFLICT`: `step` во время `play`, `play` на последнем шаге, `step` на последнем шаге
        (защитная проверка: пройдя последний шаг, сессия завершается, и дальше любая команда — 409 `SESSION_NOT_ACTIVE`).
        `pause`, `speed` и `play` не обращаются к воркеру (кроме самой первой команды сессии), поэтому остановить время можно и при сбое воркера.
        Изменение состояния плеера публикуется событием `player`.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerCommand' }
      responses:
        '200':
          description: Актуальное состояние плеера
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: 'Сессия не активна (`SESSION_NOT_ACTIVE`), команда не подходит состоянию плеера (`PLAYER_STATE_CONFLICT`: `step` во время `play`, `play` и `step` на последнем шаге) или повтор, пока первый запрос с тем же `Idempotency-Key` выполняется (`IDEMPOTENCY_KEY_IN_PROGRESS`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/events:
    get:
      tags: [sessions]
      operationId: streamSessionEvents
      summary: Поток событий сессии (SSE)
      description: |
        Один поток на сессию с поддержкой `Last-Event-ID`. При потере событий после обрыва
        клиент восстанавливает состояние снимком `GET /sessions/{sessionId}` (INV-8).
        Без подписчиков дольше `lab.session.disconnect-pause-after` (5 с) ручная сессия встаёт на паузу.
        Данные каждого события — JSON соответствующей схемы; имя события (`event:`) равно значению `type`.
        Строка `id:` равна `eventId` и монотонно возрастает в рамках сессии: по ней клиент сопоставляет
        снимок (`step`) с догоняющими событиями и убирает дубли. Чтобы получить ровно события после снимка,
        откройте поток с `Last-Event-ID`, равным `lastEventId` снимка (`"0"` — событий ещё не было). Смена состояния плеера (play, пауза,
        скорость) публикуется событием `player`, так вторая вкладка узнаёт о ней без снимка.
        На скоростях ×10 и ×100 за такт часов (не чаще 200 мс) проходит несколько свечей: событие `step` одно на такт,
        `result.bars` содержит все свечи пачки, а `step` — последний шаг. Событие никогда не опережает курсор сессии (INV-1).
        События завершённой сессии хранятся сутки.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Поток `text/event-stream`
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/SessionEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /sessions/{sessionId}/orders:
    post:
      tags: [sessions]
      operationId: placeOrder
      summary: Подать заявку
      description: |
        Заявка действует с шага курсора + 1 (INV-2). `seenStep` больше шага курсора — отказ `INVALID_PARAMS` (поле `seenStep`).
        Клиент всегда передаёт цены экрана; в слепом режиме backend переводит заявку в рубли через `EstimateOrder` ядра
        и записывает в журнал `resolved_order`. При отказе возвращается 200 с `accepted: false` и причиной;
        запись отказа в журнал — внутренняя деталь backend.
        Бумага: в слепой сессии `paperIndex`, в раскрытой `paperId` из каталога.
        OCO (`type: oco`) допустим только в запросе: backend создаёт две ноги (`stop` и `take_profit`),
        связанные `ocoSiblingId`; нужны `stopPrice` и `takeProfitPrice`. В `order` — нога `stop`, обе — в `orderIds`.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderCommand' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/orders/{orderId}:
    delete:
      tags: [sessions]
      operationId: cancelOrder
      summary: Отменить заявку
      description: |
        Для OCO `orderId` — id любой из двух ног, отмена действует на всю пару «стоп + тейк-профит».
        В ответе `orderIds` пуст (созданных заявок нет), `order` и `orders` — отменённые ноги.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: seenStep
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/OrderCommand' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
    put:
      tags: [sessions]
      operationId: replaceOrder
      summary: Заменить параметры заявки
      description: |
        Атомарная замена: в журнал пишутся отмена и новая заявка с одним номером шага.
        Для OCO `orderId` — id любой ноги, заменяется вся пара «стоп + тейк-профит».
        В ответе `orderIds`, `order` и `orders` — новые заявки (у OCO — обе ноги, `order` — стоп).
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderCommand' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/order-estimate:
    post:
      tags: [sessions]
      operationId: estimateOrder
      summary: Оценка стоимости и издержек заявки (INV-6, без записи в журнал)
      description: |
        Вызывает `EstimateOrder` ядра по `close` последнего бара до курсора, не изменяет журнал (INV-8).
        Клиент передаёт цены в шкале экрана; в слепом режиме возвращается `BlindOrderEstimate` (только % от начального капитала, без рублей и рублёвых цен, INV-7).
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstimateOrderRequest' }
      responses:
        '200':
          description: Оценка заявки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEstimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/finish:
    post:
      tags: [sessions]
      operationId: finishSession
      summary: Завершить сессию (в том числе досрочно)
      description: |
        Повторное завершение уже завершённой сессии возвращает 200 с текущим состоянием.
        При недоступности воркера — 503, сессия остаётся активной.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Сессия завершена, отчёт готовится
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinishResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/replay:
    get:
      tags: [sessions]
      operationId: getReplay
      summary: Воспроизведение завершённой сессии на заданном шаге (INV-8)
      description: |
        Без серверного состояния: курсор воспроизведения хранит клиент и передаёт явный `step`.
        Ответ `READY` различается по `kind`: `SNAPSHOT` (запрос без `fromStep`) — полный снимок `snapshot` на шаге `step`;
        `INCREMENT` (с `fromStep`) — приращение `increment` (`OpenStepResult` за `(fromStep; step]` без истории свечей). `step` больше `totalSteps`
        ограничивается последним шагом (ответ содержит фактический шаг); `fromStep` больше `step` — 400, равный — пустое приращение.
        Всегда 200 с `status` (`READY`, `NOT_FINISHED`, `NOT_FOUND`).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: step
          in: query
          required: false
          description: Шаг воспроизведения; по умолчанию 0
          schema: { type: integer, minimum: 0, default: 0 }
        - name: fromStep
          in: query
          required: false
          description: Предыдущий шаг клиента; если передан, возвращается приращение вместо снимка
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Результат воспроизведения, различается по `status`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /sessions/{sessionId}/report:
    get:
      tags: [analysis]
      operationId: getReport
      summary: Отчёт сессии
      description: |
        Всегда 200 с `status` (`READY`, `BUILDING`, `NOT_FINISHED`, `NOT_FOUND`) —
        так клиент различает состояния без разбора ошибок.
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Отчёт или его состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
  /sessions/{sessionId}/report/export:
    get:
      tags: [analysis]
      operationId: exportReport
      summary: Выгрузка отчёта (ФТ-17)
      description: |
        Файл из сохранённого отчёта завершённой сессии, без повторного расчёта. `xlsx` — листы «Сводка», «Метрики»,
        «Сделки», «Заявки», «Издержки», «Кривая капитала», «Параметры и версии» и, если есть в отчёте, «Сравнение»,
        «Расхождения»; `csv` — ZIP с файлом на каждый лист (UTF-8 с BOM, разделитель `;`, десятичная запятая,
        RFC 4180). Даты `ДД.ММ.ГГГГ`, время МСК `ЧЧ:ММ:СС`. Имя файла — в `Content-Disposition`:
        `report-<sessionId>.xlsx` или `report-<sessionId>.zip`.
        Чужая или несуществующая сессия — 404. Идущая сессия (в том числе слепая, INV-7) и отчёт, который ещё
        строится, — 409 без данных сессии; во втором случае запрос повторяют позже.
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv] } }
      responses:
        '200':
          description: Файл выгрузки
          headers:
            Content-Disposition:
              description: '`attachment; filename="report-<sessionId>.xlsx"` или `.zip` для csv'
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sessions/{sessionId}/report/compare:
    post:
      tags: [analysis]
      operationId: compareSessionWithAlgorithms
      summary: Постфактум-сравнение завершённой сессии с алгоритмами (UC-9 п. 1а/1б)
      description: |
        Сравнивает завершённую ручную сессию сразу с 1–5 алгоритмами из каталога Мастерской без изменения
        исходной сессии и сохранённого отчёта (INV-3, INV-5). В запросе передаются идентификаторы стратегий
        (`algorithmIds`), для каждой берётся последняя доступная пользователю опубликованная версия.
        Идущая сессия — 409 `NOT_FINISHED` без раскрытия (INV-1, INV-7); чужая или несуществующая сессия, а также
        недоступный/неопубликованный алгоритм — 404 `NOT_FOUND`.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompareSessionRequest' }
      responses:
        '200':
          description: Результат сравнения с алгоритмами и сводный консенсус
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCompareResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /history:
    get:
      tags: [analysis]
      operationId: listHistory
      summary: История сессий и прогонов
      description: Сортировка — по дате создания, новые сверху. Постраничная пагинация.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [session, algo_run] } }
        - { name: blindOnly, in: query, schema: { type: boolean, default: false } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HistoryStatus' } }
        - { name: regime, in: query, schema: { $ref: '#/components/schemas/Regime' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
  /workshop/algorithms:
    get:
      tags: [workshop]
      operationId: listWorkshopAlgorithms
      summary: Каталог алгоритмов Мастерской
      description: Возвращает опубликованные публичные алгоритмы и собственные алгоритмы текущего пользователя.
      parameters:
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/WorkshopSortField' } }
        - { name: authorId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: mineOnly, in: query, schema: { type: boolean, default: false } }
        - { name: cleanOnly, in: query, schema: { type: boolean, default: false } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Страница каталога алгоритмов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [workshop]
      operationId: createWorkshopAlgorithm
      summary: Создать новый алгоритм и его черновик
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkshopAlgorithmRequest' }
      responses:
        '201':
          description: Черновик алгоритма создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
  /workshop/algorithms/{id}:
    get:
      tags: [workshop]
      operationId: getWorkshopAlgorithm
      summary: Карточка алгоритма Мастерской
      description: Чужие скрытые и несуществующие алгоритмы возвращают 200 со статусом `NOT_FOUND`.
      parameters: [{ $ref: '#/components/parameters/AlgorithmId' }]
      responses:
        '200':
          description: Карточка алгоритма или NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopDetailResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workshop]
      operationId: deleteWorkshopAlgorithm
      summary: Удалить собственный алгоритм Мастерской (мягкое удаление, INV-5)
      description: |
        Помечает стратегию как удалённую (`visibility = deleted`). Опубликованные версии и история прогонов сохраняются (`INV-5`).
        Чужой или уже удалённый алгоритм возвращает 404, системный «Эталон платформы» — 409.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/AlgorithmId' }]
      responses:
        '204':
          description: Алгоритм удалён
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /workshop/algorithms/{id}/draft:
    get:
      tags: [workshop]
      operationId: getWorkshopDraft
      summary: Получить черновик алгоритма владельца
      parameters: [{ $ref: '#/components/parameters/AlgorithmId' }]
      responses:
        '200':
          description: Черновик алгоритма
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [workshop]
      operationId: saveWorkshopDraft
      summary: Сохранить черновик алгоритма владельца
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/AlgorithmId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkshopDraftRequest' }
      responses:
        '200':
          description: Черновик обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /workshop/check:
    post:
      tags: [workshop]
      operationId: checkWorkshopStrategy
      summary: Статическая проверка и линтер DSL-стратегии
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckStrategyRequest' }
      responses:
        '200':
          description: Результат статической проверки и объявленные параметры
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckStrategyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /workshop/algorithms/{id}/publish:
    post:
      tags: [workshop]
      operationId: publishWorkshopAlgorithm
      summary: Опубликовать новую неизменяемую версию алгоритма (INV-5)
      description: Предварительно вызывает статическую проверку; при `lookaheadLevel == ERROR` возвращает 422 `STRATEGY_INVALID`.
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/AlgorithmId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishWorkshopAlgorithmRequest' }
      responses:
        '201':
          description: Версия опубликована
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopAlgorithmVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /workshop/algorithms/{id}/fork:
    post:
      tags: [workshop]
      operationId: forkWorkshopAlgorithm
      summary: Создать черновик на основе опубликованной версии алгоритма (UC-20)
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/AlgorithmId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForkWorkshopAlgorithmRequest' }
      responses:
        '201':
          description: Создан новый алгоритм-форк с черновиком
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /workshop/algorithms/{id}/visibility:
    patch:
      tags: [workshop]
      operationId: updateWorkshopVisibility
      summary: Скрыть или вернуть собственный алгоритм в каталог (UC-21)
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/AlgorithmId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkshopVisibilityRequest' }
      responses:
        '200':
          description: Видимость обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopAlgorithmSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /runs:
    post:
      tags: [simulation]
      operationId: createRun
      summary: Запустить прогон алгоритма на истории (UC-14)
      description: |
        Подбирает период через `LaunchPlanner` и ставит прогон в фоновую очередь воркера.
        При отклонении параметров периода — 422 `LaunchProblem`, при статических ошибках DSL — 422 `STRATEGY_INVALID`.
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
      responses:
        '201':
          description: Прогон поставлен в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: Параметры запуска отклонены или стратегия содержит ошибки DSL
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LaunchProblem'
                  - $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит очереди прогонов пользователя (код `TOO_MANY_REQUESTS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /runs/compare:
    post:
      tags: [simulation]
      operationId: createCompareRuns
      summary: Запустить несколько алгоритмов в сравнение на одном отрезке
      description: |
        Подбирает исторический отрезок ровно один раз через `LaunchPlanner` и ставит в фоновую очередь 2–5 прогонов
        на этом же отрезке (одинаковые снапшот, даты окна, список и порядок бумаг, таймфрейм, длительность и капитал).
        В слепом режиме даты и тикеры в ответе скрываются до завершения прогонов (INV-7).
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompareRunsRequest' }
      responses:
        '201':
          description: Пакет прогонов поставлен в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompareRunsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: Параметры запуска отклонены или одна из стратегий содержит ошибки DSL
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LaunchProblem'
                  - $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит очереди прогонов пользователя (код `TOO_MANY_REQUESTS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /runs/{runId}:
    get:
      tags: [simulation]
      operationId: getRun
      summary: Статус и метаданные прогона алгоритма
      description: В слепом режиме до завершения прогона период и бумаги не раскрываются (INV-7).
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: Состояние прогона
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /runs/{runId}/repeat:
    post:
      tags: [simulation]
      operationId: repeatRun
      summary: Повторить прогон с теми же параметрами, снапшотом и периодом (UC-18, INV-4)
      security:
        - sessionCookie: []
          xsrfToken: []
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '201':
          description: Повторный прогон поставлен в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429':
          description: Превышен лимит очереди прогонов пользователя (код `TOO_MANY_REQUESTS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/WorkerUnavailable' }
  /runs/{runId}/events:
    get:
      tags: [simulation]
      operationId: streamRunEvents
      summary: Поток событий прогона алгоритма (SSE)
      description: Поддерживает `Last-Event-ID`. Публикует `run_progress`, `run_finished`, `run_failed`, `report_ready`.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 'SSE-поток событий (`RunEvent` в `data:`, `id:` — монотонный идентификатор события)'
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RunEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /runs/{runId}/report:
    get:
      tags: [analysis]
      operationId: getRunReport
      summary: Отчёт прогона алгоритма
      description: Всегда 200 со статусом `READY`, `BUILDING`, `NOT_FINISHED` или `NOT_FOUND`.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: Отчёт прогона или его состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunReportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
  /runs/{runId}/report/export:
    get:
      tags: [analysis]
      operationId: exportRunReport
      summary: Выгрузка отчёта прогона алгоритма (ФТ-17)
      description: |
        Файл из сохранённого отчёта завершённого прогона (`run-<runId>.xlsx` или `run-<runId>.zip`).
        Чужой или несуществующий прогон — 404. Незавершённый или ещё строящийся отчёт — 409.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv] } }
      responses:
        '200':
          description: Файл выгрузки
          headers:
            Content-Disposition:
              description: '`attachment; filename="run-<runId>.xlsx"` или `.zip` для csv'
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie сессии `HttpOnly; Secure; SameSite=Lax`.
    xsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: CSRF-токен из cookie `XSRF-TOKEN` (Angular `HttpClientXsrfModule`), обязателен для изменяющих запросов.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Необязательный ключ идемпотентности (UUID) для подачи, отмены и замены заявки и для команд плеера. Повтор запроса
        с тем же ключом (например, после обрыва сети) возвращает прежний результат и не пишет в журнал второй раз (INV-8).
        Область ключа — сессия; ключ хранится до конца сессии. Поведение по черновику IETF: тот же ключ с другим телом или
        для другой операции — 422 `IDEMPOTENCY_KEY_REUSED`; повтор, пока первый запрос ещё выполняется, —
        409 `IDEMPOTENCY_KEY_IN_PROGRESS`.
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AlgorithmId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
  responses:
    Problem:
      description: Ошибка (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflict:
      description: Первый запрос с этим `Idempotency-Key` ещё выполняется (`IDEMPOTENCY_KEY_IN_PROGRESS`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyKeyReused:
      description: '`Idempotency-Key` уже использован с другим телом или для другой операции (`IDEMPOTENCY_KEY_REUSED`)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Некорректный запрос — битый JSON, нарушенный формат (`Money`, `Price`), неизвестное значение enum, не-UUID в пути
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Отсутствует или неверен CSRF-токен (`X-XSRF-TOKEN`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WorkerUnavailable:
      description: Воркер ядра недоступен; состояние сессии не изменилось
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ArchiveUnavailable:
      description: Архив данных не готов (нет готового снапшота) или недоступен (ClickHouse, воркер ядра)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Слишком много попыток входа; повторить можно через `Retry-After` секунд
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить попытку
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrderCommand:
      description: |
        Результат команды заявки. Отказ — 200 с `accepted: false` и причиной;
        запись отказа в журнал — внутренняя деталь backend.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderCommandResult' }
  schemas:
    # ---------- общие ----------
    Uuid:
      type: string
      format: uuid
      description: Идентификатор UUID v7 — хранимые сущности (сессии, прогоны, стратегии, пользователи, заявки)
    DerivedUuid:
      type: string
      format: uuid
      description: |
        Детерминированный UUID v5 из (сессия, вид сущности, номер в ядре). Для сущностей, которые
        пересчитываются из журнала (исполнения, сделки, расхождения): id одинаков в снимке, SSE и отчёте (INV-8).
        Номер в ядре по видам: исполнение — (`order_id`, `step`) из `Fill`; закрытая сделка — индекс в `round_trips` отчёта ядра;
        расхождение и сделка обратной проверки — индекс в результате разбора core.
    DerivedUuidOrNull:
      oneOf: [{ $ref: '#/components/schemas/DerivedUuid' }, { type: 'null' }]
    PaperIndex:
      type: integer
      minimum: 0
      description: Индекс бумаги в сессии (как `instrument_index` ядра); в слепом режиме единственный идентификатор бумаги (INV-7). Backend передаёт бумаги в `MarketSpec.instruments` в случайном порядке, индекс не должен совпадать с порядком по тикеру
    UuidOrNull:
      oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
    Problem:
      type: object
      description: RFC 9457. Для слепой сессии `detail` и `instance` не содержат дат, тикеров и названий (INV-7)
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        code: { $ref: '#/components/schemas/ProblemCode' }
    ProblemCode:
      type: string
      description: Машинный код любой ошибки API (enum `ErrorCode` в backend); клиент ветвится по нему, а не по `status` и `detail`
      enum:
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_PROGRESS
        - SESSION_NOT_ACTIVE
        - PLAYER_STATE_CONFLICT
        - NOT_FINISHED
        - REPORT_BUILDING
        - NO_MATCHING_PERIOD
        - TOO_MANY_BARS
        - INVALID_PARAMS
        - CORPORATE_ACTION_ON_PERIOD
        - STRATEGY_INVALID
        - DAILY_LOSS_LIMIT_REACHED
        - CONFLICT
        - BAD_REQUEST
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - CSRF_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - NOT_ACCEPTABLE
        - UNSUPPORTED_MEDIA_TYPE
        - TOO_MANY_REQUESTS
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    LaunchProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, field, barsCount, maxBars]
          properties:
            code: { $ref: '#/components/schemas/LaunchRejectReason' }
            field: { type: [string, 'null'] }
            barsCount: { type: [integer, 'null'], description: 'Только для `TOO_MANY_BARS`; в слепом режиме `null`, если лимит превышен у всех подобранных окон (INV-7)' }
            maxBars: { type: [integer, 'null'] }
    Money:
      type: string
      description: Десятичная строка рублей (INV-6), не number
      pattern: '^-?\d+(\.\d{1,2})?$'
      examples: ['1000000.00']
    Pct:
      type: string
      description: Процент десятичной строкой, без экспоненты
      pattern: '^-?\d+(\.\d{1,6})?$'
      examples: ['12.34']
    Price:
      type: string
      description: Цена десятичной строкой, до 9 знаков по точности `core::Decimal` (в слепом режиме — условная, от 100, 2 знака HALF_UP)
      pattern: '^\d+(\.\d{1,9})?$'
    Ratio:
      type: string
      description: Безразмерная величина десятичной строкой без экспоненты (Sharpe, HHI и т. п.)
      pattern: '^-?\d+(\.\d+)?$'
    PriceOrNull:
      oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
    PctOrNull:
      oneOf: [{ $ref: '#/components/schemas/Pct' }, { type: 'null' }]
    MoneyOrNull:
      oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
    RatioOrNull:
      oneOf: [{ $ref: '#/components/schemas/Ratio' }, { type: 'null' }]
    Regime:
      type: string
      description: Категория исторического периода (`ClassifyPeriods`); клиенту до конца сессии доступна только категория (INV-1, INV-7)
      enum: [calm, medium, stress]
    Timeframe:
      type: string
      enum: [1m, 5m, 10m, 15m, 1h, 1d]
    OrderSide:
      type: string
      enum: [buy, sell]
    OrderType:
      type: string
      description: 'Тип в запросе; `oco` — пара «стоп + тейк-профит» на одну бумагу, допустим только в запросах (в ядре — две связанные заявки)'
      enum: [market, limit, stop, stop_limit, take_profit, trailing, oco]
    OrderLegType:
      type: string
      description: 'Тип заявки в ответах (`Order`, исполнения): одна нога, `oco` не встречается — нога OCO имеет тип `stop` или `take_profit`'
      enum: [market, limit, stop, stop_limit, take_profit, trailing]
    TimeInForce:
      type: string
      enum: [day, gtc]
    OrderStatus:
      type: string
      enum: [active, filled, partial, cancelled, expired, rejected]
    RejectReason:
      type: string
      description: Причины отказа при подаче/отмене/замене/оценке заявки (`decisions.md`, «Заявки»)
      enum: [INVALID_PARAMS, INSUFFICIENT_CASH, INSUFFICIENT_POSITION, SESSION_NOT_ACTIVE, ORDER_NOT_ACTIVE]
    OrderReason:
      type: string
      description: Все причины отказа, снятия или закрытия заявки (`simulation.proto`, `enum Reason`)
      enum:
        - INVALID_PARAMS
        - INSUFFICIENT_CASH
        - INSUFFICIENT_POSITION
        - SESSION_NOT_ACTIVE
        - ORDER_NOT_ACTIVE
        - LIQUIDITY_LIMIT
        - OCO_SIBLING_FILLED
        - POSITION_CLOSED
        - REPLACED
        - SESSION_END
        - CANCELLED_BY_USER
        - DAY_EXPIRED
        - INSUFFICIENT_MARGIN
        - MARGIN_CALL_LIQUIDATION
        - IMMEDIATE_OR_CANCEL
        - FILL_OR_KILL
        - PRICE_OUT_OF_BAND
    LaunchRejectReason:
      type: string
      enum: [NO_MATCHING_PERIOD, TOO_MANY_BARS, INVALID_PARAMS, CORPORATE_ACTION_ON_PERIOD]
    HistoryStatus:
      type: string
      enum: [running, completed, finished_early, bankrupt, invalid, failed]
    PlayerAction:
      type: string
      enum: [play, pause, step, speed]
    PlayerSpeed:
      type: integer
      enum: [1, 5, 10, 100]
    # ---------- вход и профиль ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, description: 'Не длиннее 254 символов (RFC 5321); длиннее — 400' }
        password: { type: string, format: password, description: 'Не длиннее 72 байт в UTF-8 (предел bcrypt, кириллица — 2 байта на символ); длиннее — 400. maxLength не задан, так как считает символы, а не байты' }
    CurrentUser:
      type: object
      required: [id, email, role]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        role: { type: string, enum: [USER] }
    # ---------- запуск ----------
    ExecutionRulesSummary:
      type: object
      required: [commissionPct, exchangeFeePct, spreadPct, slippageKappa, liquidityLimitPct, maxBars]
      properties:
        commissionPct: { $ref: '#/components/schemas/Pct' }
        exchangeFeePct: { $ref: '#/components/schemas/Pct' }
        spreadPct: { $ref: '#/components/schemas/Pct' }
        slippageKappa: { $ref: '#/components/schemas/Ratio' }
        liquidityLimitPct: { $ref: '#/components/schemas/Pct' }
        maxBars: { type: integer }
    LaunchOptions:
      type: object
      required: [durations, defaultDuration, availableTimeframes, maxDurationDaysByTimeframe, defaultTimeframe, regimes, defaultRegime, capitalPresets, defaultCapital, backgroundAlgorithmName, minPapers, maxPapers, defaultPaperCount, executionRules, archiveFrom, archiveTo]
      properties:
        durations: { type: array, items: { type: integer, enum: [20, 60, 120, 250] } }
        defaultDuration: { type: integer, enum: [20, 60, 120, 250] }
        availableTimeframes: { type: array, items: { $ref: '#/components/schemas/Timeframe' } }
        maxDurationDaysByTimeframe:
          type: object
          description: |
            Для каждого шага из `availableTimeframes` — наибольшая длительность в торговых днях, при которой шагов
            шкалы сессии заведомо не больше `executionRules.maxBars`. Оценка консервативная, по наибольшему числу
            шагов за день в архиве. Длительности из `durations` больше этого значения экран выключает; пограничные
            случаи решает отказ `TOO_MANY_BARS` при запуске.
          propertyNames: { $ref: '#/components/schemas/Timeframe' }
          additionalProperties: { type: integer, minimum: 0 }
        defaultTimeframe: { $ref: '#/components/schemas/Timeframe' }
        regimes: { type: array, items: { $ref: '#/components/schemas/Regime' } }
        defaultRegime: { $ref: '#/components/schemas/Regime' }
        capitalPresets: { type: array, items: { $ref: '#/components/schemas/Money' } }
        defaultCapital: { $ref: '#/components/schemas/Money' }
        backgroundAlgorithmName: { type: string }
        minPapers: { type: integer }
        maxPapers: { type: integer }
        defaultPaperCount: { type: integer }
        executionRules: { $ref: '#/components/schemas/ExecutionRulesSummary' }
        archiveFrom: { type: [string, 'null'], format: date, description: Первая доступная дата торгового календаря архива }
        archiveTo: { type: [string, 'null'], format: date, description: Последняя доступная дата торгового календаря архива }
    LaunchPaper:
      type: object
      description: Каталог для режима «своя дата» (сессия неслепая), поэтому тикер и название допустимы
      required: [id, sector, ticker, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sector: { type: string }
        ticker: { type: string }
        name: { type: string }
        assetClass:
          type: string
          enum: [EQUITY, BOND, ETF, CURRENCY, METAL]
          default: EQUITY
          description: Класс актива бумаги (по умолчанию `EQUITY`)
    CreateSessionRequest:
      type: object
      required: [traderKind, durationDays, timeframe, regime, startMode, customStartDate, paperCount, paperIds, initialCapital]
      properties:
        traderKind: { type: string, enum: [human] }
        durationDays: { type: integer, enum: [20, 60, 120, 250] }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        regime: { $ref: '#/components/schemas/Regime' }
        startMode: { type: string, enum: [random, custom] }
        customStartDate: { type: [string, 'null'], format: date, description: Только для custom }
        paperCount: { type: [integer, 'null'] }
        paperIds:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Uuid' }
        initialCapital: { $ref: '#/components/schemas/Money' }
        backgroundAlgorithmId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: Необязательный идентификатор алгоритма из каталога мастерской для фонового сравнения (по умолчанию — «Эталон платформы»)
        dailyLossLimitPct:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100
          description: Необязательный лимит дневного убытка в % от капитала начала торгового дня (kill-switch); null или отсутствие поля — отключён
    CreatedSession:
      type: object
      required: [sessionId]
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
    # ---------- свечи, заявки, портфель ----------
    BlindCandle:
      type: object
      unevaluatedProperties: false
      description: Свеча слепого режима (`BlindBar`), без реальных дат; цена от 100, шаг прогрева < 0 (INV-1, INV-7)
      required: [step, day, candleInDay, open, high, low, close, volume, afterHalt]
      properties:
        step: { type: integer, description: 'Номер шага; < 0 — бар прогрева' }
        day: { type: integer, description: 'Относительный торговый день; <= 0 — прогрев' }
        candleInDay: { type: integer }
        open: { $ref: '#/components/schemas/Price' }
        high: { $ref: '#/components/schemas/Price' }
        low: { $ref: '#/components/schemas/Price' }
        close: { $ref: '#/components/schemas/Price' }
        volume: { type: string, description: 'Относительный объём (`volume_rel`, 2 знака HALF_UP)', pattern: '^\d+(\.\d{1,2})?$' }
        afterHalt: { type: boolean, description: Первый бар после разрыва торгов }
    OpenCandle:
      type: object
      description: Свеча раскрытого режима (`Bar`), с реальным временем и объёмом в лотах
      required: [step, day, candleInDay, openedAt, open, high, low, close, volume, afterHalt]
      properties:
        step: { type: integer, description: 'Номер шага; < 0 — бар прогрева' }
        day: { type: integer, description: 'Относительный торговый день; <= 0 — прогрев' }
        candleInDay: { type: integer }
        openedAt: { type: string, format: date-time }
        open: { $ref: '#/components/schemas/Price' }
        high: { $ref: '#/components/schemas/Price' }
        low: { $ref: '#/components/schemas/Price' }
        close: { $ref: '#/components/schemas/Price' }
        volume: { type: integer, minimum: 0, description: Объём бара в лотах }
        afterHalt: { type: boolean, description: Первый бар после разрыва торгов }
    OrderBase:
      type: object
      description: |
        Одна заявка (нога). Заявка OCO в ответах — две ноги с `type: stop` и `type: take_profit`, связанные
        `ocoSiblingId`; уровень тейка лежит в `takeProfitPrice` ноги `take_profit`, уровень стопа — в `stopPrice` ноги `stop`.
        Цены в шкале текущего режима.
      required: [id, side, type, lots, filledLots, tif, status, step, seenStep, closedStep, ocoSiblingId, limitPrice, stopPrice, takeProfitPrice, trailingPct, trailingStopLevel, reason, rejectField]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderLegType' }
        lots: { type: integer, minimum: 1 }
        filledLots: { type: integer, minimum: 0 }
        tif: { $ref: '#/components/schemas/TimeInForce' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        step: { type: integer, description: Шаг курсора на момент приёма }
        seenStep: { type: integer, description: 'Шаг, который видел клиент; не больше step' }
        closedStep: { type: [integer, 'null'], description: Шаг закрытия заявки или null для открытой }
        ocoSiblingId: { $ref: '#/components/schemas/UuidOrNull', description: Связанная нога OCO («стоп + тейк») или null }
        limitPrice: { $ref: '#/components/schemas/PriceOrNull' }
        stopPrice: { $ref: '#/components/schemas/PriceOrNull' }
        takeProfitPrice: { $ref: '#/components/schemas/PriceOrNull' }
        trailingPct: { $ref: '#/components/schemas/PctOrNull' }
        trailingStopLevel: { $ref: '#/components/schemas/PriceOrNull', description: Текущий расчётный уровень трейлинг-стопа }
        reason:
          oneOf: [{ $ref: '#/components/schemas/OrderReason' }, { type: 'null' }]
        rejectField: { type: [string, 'null'] }
    BlindOrder:
      description: Заявка слепой сессии; бумага — `paperIndex`, без ключа и каталожного id (INV-7)
      allOf:
        - $ref: '#/components/schemas/OrderBase'
        - type: object
          required: [mode, paperIndex]
          properties:
            mode: { type: string, const: BLIND }
            paperIndex: { $ref: '#/components/schemas/PaperIndex' }
      unevaluatedProperties: false
    OpenOrder:
      description: Заявка раскрытой сессии; бумага — `paperId` из каталога
      allOf:
        - $ref: '#/components/schemas/OrderBase'
        - type: object
          required: [mode, paperId]
          properties:
            mode: { type: string, const: OPEN }
            paperId: { $ref: '#/components/schemas/Uuid' }
    BlindFill:
      type: object
      description: |
        Исполнение в слепом режиме (`BlindFill`), суммы в процентах от начального капитала, без рублей и дат (INV-7).
        `id` — детерминированный UUID v5 (сессия, вид, номер в ядре).
      unevaluatedProperties: false
      required: [id, orderId, paperIndex, step, day, candleInDay, side, type, lots, price, amountPct, costPct, stopAndTakeSameBar]
      properties:
        id: { $ref: '#/components/schemas/DerivedUuid' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        paperIndex: { $ref: '#/components/schemas/PaperIndex' }
        step: { type: integer }
        day: { type: integer }
        candleInDay: { type: integer }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderLegType' }
        lots: { type: integer, minimum: 1 }
        price: { $ref: '#/components/schemas/Price' }
        amountPct: { $ref: '#/components/schemas/Pct' }
        costPct: { $ref: '#/components/schemas/Pct', description: 'Общие издержки сделки в % начального капитала, считает core (core#54)' }
        stopAndTakeSameBar: { type: boolean, description: Стоп и тейк задеты одной свечой — исполнен стоп (INV-3) }
    OpenFill:
      type: object
      description: |
        Исполнение в раскрытом режиме (`Fill`), с реальным временем и суммами в рублях.
        `id` — детерминированный UUID v5 (сессия, вид, номер в ядре).
      required: [id, orderId, paperId, step, day, candleInDay, executedAt, side, type, lots, price, amountPct, costPct, amount, cost, stopAndTakeSameBar]
      properties:
        id: { $ref: '#/components/schemas/DerivedUuid' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        paperId: { $ref: '#/components/schemas/Uuid' }
        step: { type: integer }
        day: { type: integer }
        candleInDay: { type: integer }
        executedAt: { type: string, format: date-time }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderLegType' }
        lots: { type: integer, minimum: 1 }
        price: { $ref: '#/components/schemas/Price' }
        amountPct: { $ref: '#/components/schemas/Pct', description: 'Сумма сделки в % начального капитала, считает core (core#54)' }
        costPct: { $ref: '#/components/schemas/Pct', description: 'Общие издержки сделки в % начального капитала, считает core (core#54)' }
        amount: { $ref: '#/components/schemas/Money' }
        cost: { $ref: '#/components/schemas/Money', description: 'Общие издержки сделки (комиссия, сбор, спред, проскальзывание), считает core (core#54)' }
        stopAndTakeSameBar: { type: boolean, description: Стоп и тейк задеты одной свечой — исполнен стоп (INV-3) }
    BlindPosition:
      type: object
      description: Позиция в слепом режиме (`BlindPosition`), без рублёвых сумм (INV-7)
      unevaluatedProperties: false
      required: [paperIndex, lots, avgPrice, pnlPct, valuePct]
      properties:
        paperIndex: { $ref: '#/components/schemas/PaperIndex' }
        lots: { type: integer }
        avgPrice: { $ref: '#/components/schemas/PriceOrNull' }
        pnlPct: { $ref: '#/components/schemas/Pct', description: 'Нереализованный P&L в % начального капитала, считает core (core#54)' }
        valuePct: { $ref: '#/components/schemas/Pct' }
    OpenPosition:
      type: object
      description: Позиция в раскрытом режиме (`Position`), с рублёвой оценкой
      required: [paperId, lots, avgPrice, pnlPct, valuePct, marketValue]
      properties:
        paperId: { $ref: '#/components/schemas/Uuid' }
        lots: { type: integer }
        avgPrice: { $ref: '#/components/schemas/PriceOrNull' }
        pnlPct: { $ref: '#/components/schemas/Pct', description: 'Нереализованный P&L в % начального капитала, считает core (core#54)' }
        valuePct: { $ref: '#/components/schemas/Pct', description: 'Стоимость позиции в % начального капитала, считает core (core#54)' }
        marketValue: { $ref: '#/components/schemas/Money' }
    BlindPortfolio:
      type: object
      unevaluatedProperties: false
      required: [mode, equityPct, cashPct, investedPct, pnlPct, costsPct, positions]
      properties:
        mode: { type: string, const: BLIND }
        equityPct: { $ref: '#/components/schemas/Pct' }
        cashPct: { $ref: '#/components/schemas/Pct' }
        investedPct: { $ref: '#/components/schemas/Pct', description: 'equityPct − cashPct, считает core (core#54)' }
        pnlPct: { $ref: '#/components/schemas/Pct' }
        costsPct: { $ref: '#/components/schemas/Pct', description: 'Накопленные издержки сделок в % начального капитала, считает core (core#54)' }
        positions: { type: array, items: { $ref: '#/components/schemas/BlindPosition' } }
    OpenPortfolio:
      type: object
      description: Раскрытый портфель; проценты (от начального капитала) и `invested`/`pnl`/`costs` считает core (core#54)
      required: [mode, equityPct, cashPct, investedPct, pnlPct, costsPct, equity, cash, invested, pnl, costs, positions]
      properties:
        mode: { type: string, const: OPEN }
        equityPct: { $ref: '#/components/schemas/Pct' }
        cashPct: { $ref: '#/components/schemas/Pct' }
        investedPct: { $ref: '#/components/schemas/Pct' }
        pnlPct: { $ref: '#/components/schemas/Pct' }
        costsPct: { $ref: '#/components/schemas/Pct' }
        equity: { $ref: '#/components/schemas/Money' }
        cash: { $ref: '#/components/schemas/Money' }
        invested: { $ref: '#/components/schemas/Money' }
        pnl: { $ref: '#/components/schemas/Money' }
        costs: { $ref: '#/components/schemas/Money' }
        positions: { type: array, items: { $ref: '#/components/schemas/OpenPosition' } }
    PaperStat:
      type: object
      unevaluatedProperties: false
      required: [changePct, lastPrice]
      properties:
        changePct: { $ref: '#/components/schemas/PctOrNull', description: 'Изменение цены с начала сессии в % (`period_pct` core, core#54); `null` только у бумаги без бара на курсоре' }
        lastPrice:
          $ref: '#/components/schemas/PriceOrNull'
          description: 'Close последнего бара до курсора; `null` только у бумаги раскрытой сессии без бара до курсора (заявку на неё ядро отклоняет до первого бара), в слепой сессии такой бумаги в списке нет'
    BlindPaper:
      type: object
      description: |
        Бумага в слепом режиме (`BlindInstrument`), без тикера, названия, размера лота и ключа (INV-7); адресуется `paperIndex`.
        До первого бара бумаги её в слепом виде нет целиком (`decisions.md`): бумага без бара до курсора в списке не
        появляется, поэтому `stat` всегда заполнен.
      unevaluatedProperties: false
      required: [paperIndex, label, sector, lotValueAtStart, candles, stat]
      properties:
        paperIndex: { $ref: '#/components/schemas/PaperIndex' }
        label: { type: string, description: 'Бумага A/B/C' }
        sector: { type: string }
        lotValueAtStart: { $ref: '#/components/schemas/Pct', description: 'Стоимость 1 лота в % от начального капитала по первой показанной свече' }
        candles: { type: array, items: { $ref: '#/components/schemas/BlindCandle' } }
        stat: { $ref: '#/components/schemas/PaperStat' }
    OpenPaper:
      type: object
      description: Бумага в раскрытом режиме; `id` — из каталога (`LaunchPaper.id`)
      required: [id, instrumentIndex, label, sector, ticker, name, lotSize, candles, stat]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        instrumentIndex: { type: integer, minimum: 0, description: 'Индекс бумаги в сессии; backend передаёт бумаги в `MarketSpec.instruments` в случайном порядке, индекс не совпадает с порядком по тикеру' }
        label: { type: string }
        sector: { type: string }
        ticker: { type: string }
        name: { type: string }
        lotSize: { type: integer, minimum: 1 }
        candles: { type: array, items: { $ref: '#/components/schemas/OpenCandle' } }
        stat: { $ref: '#/components/schemas/PaperStat' }
    SnapshotBase:
      type: object
      required: [sessionId, blind, regime, step, totalSteps, warmupSteps, day, totalDays, finished, playing, speed, lastEventId]
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
        blind: { type: boolean, description: 'Режим запуска сессии: у завершённой слепой сессии `mode` = `OPEN` (всё раскрыто), а `blind` остаётся `true` — по нему клиент пишет «Слепая (раскрыта)»' }
        regime: { $ref: '#/components/schemas/Regime' }
        step: { type: integer }
        totalSteps: { type: integer }
        warmupSteps: { type: integer, minimum: 0 }
        day: { type: integer }
        totalDays: { type: integer }
        finished: { type: boolean }
        lastEventId:
          type: [string, 'null']
          description: |
            Номер последнего события сессии (как `eventId`, строка) на момент снимка; `"0"` — событий ещё не было.
            Прочитан под той же блокировкой сессии, что и состояние. `null` — только в снимке воспроизведения
            (потока у него нет). Клиент открывает `GET /sessions/{sessionId}/events` с `Last-Event-ID: <lastEventId>`
            и получает ровно то, что случилось после снимка.
        playing: { type: [boolean, 'null'], description: 'null в снимке воспроизведения' }
        speed:
          oneOf: [{ $ref: '#/components/schemas/PlayerSpeed' }, { type: 'null' }]
          description: 'null в снимке воспроизведения'
        dailyLossLimitPct:
          type: [number, 'null']
          description: Заданный лимит дневного убытка в % (kill-switch) или null, если отключён
        killSwitchTriggered:
          type: boolean
          description: Признак срабатывания лимита дневного убытка (kill-switch)
    BlindSnapshot:
      allOf:
        - $ref: '#/components/schemas/SnapshotBase'
        - type: object
          required: [mode, papers, portfolio, fills, orders]
          properties:
            mode: { type: string, const: BLIND }
            papers: { type: array, items: { $ref: '#/components/schemas/BlindPaper' } }
            portfolio: { $ref: '#/components/schemas/BlindPortfolio' }
            fills: { type: array, items: { $ref: '#/components/schemas/BlindFill' } }
            orders: { type: array, items: { $ref: '#/components/schemas/BlindOrder' } }
      unevaluatedProperties: false
    OpenSnapshot:
      allOf:
        - $ref: '#/components/schemas/SnapshotBase'
        - type: object
          required: [mode, papers, portfolio, fills, orders]
          properties:
            mode: { type: string, const: OPEN }
            papers: { type: array, items: { $ref: '#/components/schemas/OpenPaper' } }
            portfolio: { $ref: '#/components/schemas/OpenPortfolio' }
            fills: { type: array, items: { $ref: '#/components/schemas/OpenFill' } }
            orders: { type: array, items: { $ref: '#/components/schemas/OpenOrder' } }
    Snapshot:
      oneOf:
        - $ref: '#/components/schemas/BlindSnapshot'
        - $ref: '#/components/schemas/OpenSnapshot'
      discriminator:
        propertyName: mode
        mapping: { BLIND: '#/components/schemas/BlindSnapshot', OPEN: '#/components/schemas/OpenSnapshot' }
    StepResultBase:
      type: object
      required: [step, day, finished]
      properties:
        step: { type: integer }
        day: { type: integer }
        finished: { type: boolean }
    BlindStepResult:
      description: 'Результат шага слепой сессии; словари `bars` и `paperStats` — по `paperIndex` (строка из цифр). `bars` — массив свечей пачки шагов `(предыдущий шаг; step]` по бумаге (на быстрых скоростях за такт проходит несколько свечей), шаги по возрастанию; у бумаги без свечи в пачке записи нет'
      allOf:
        - $ref: '#/components/schemas/StepResultBase'
        - type: object
          required: [mode, bars, paperStats, portfolio, fills, orders]
          properties:
            mode: { type: string, const: BLIND }
            bars:
              type: object
              propertyNames: { pattern: '^\d+$' }
              additionalProperties:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/BlindCandle' }
            paperStats:
              type: object
              propertyNames: { pattern: '^\d+$' }
              additionalProperties: { $ref: '#/components/schemas/PaperStat' }
            portfolio: { $ref: '#/components/schemas/BlindPortfolio' }
            fills: { type: array, items: { $ref: '#/components/schemas/BlindFill' } }
            orders: { type: array, items: { $ref: '#/components/schemas/BlindOrder' } }
      unevaluatedProperties: false
    OpenStepResult:
      description: 'Результат шага раскрытой сессии; словари `bars` и `paperStats` — по `paperId` из каталога. `bars` — массив свечей пачки шагов `(предыдущий шаг; step]` по бумаге, шаги по возрастанию; у бумаги без свечи в пачке записи нет'
      allOf:
        - $ref: '#/components/schemas/StepResultBase'
        - type: object
          required: [mode, bars, paperStats, portfolio, fills, orders]
          properties:
            mode: { type: string, const: OPEN }
            bars:
              type: object
              propertyNames: { format: uuid }
              additionalProperties:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/OpenCandle' }
            paperStats:
              type: object
              propertyNames: { format: uuid }
              additionalProperties: { $ref: '#/components/schemas/PaperStat' }
            portfolio: { $ref: '#/components/schemas/OpenPortfolio' }
            fills: { type: array, items: { $ref: '#/components/schemas/OpenFill' } }
            orders: { type: array, items: { $ref: '#/components/schemas/OpenOrder' } }
    StepResult:
      oneOf:
        - $ref: '#/components/schemas/BlindStepResult'
        - $ref: '#/components/schemas/OpenStepResult'
      discriminator:
        propertyName: mode
        mapping: { BLIND: '#/components/schemas/BlindStepResult', OPEN: '#/components/schemas/OpenStepResult' }
    # ---------- плеер ----------
    PlayerCommand:
      type: object
      description: 'Команда плеера; `speed` обязателен при `action: speed`, при остальных — отсутствует или null'
      required: [action]
      properties:
        action: { $ref: '#/components/schemas/PlayerAction' }
        speed:
          oneOf: [{ $ref: '#/components/schemas/PlayerSpeed' }, { type: 'null' }]
    PlayerStateBase:
      type: object
      required: [sessionId, playing, speed, step, day, finished]
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
        playing: { type: boolean }
        speed: { $ref: '#/components/schemas/PlayerSpeed' }
        step: { type: integer }
        day: { type: integer }
        finished: { type: boolean }
    BlindPlayerState:
      allOf:
        - $ref: '#/components/schemas/PlayerStateBase'
        - type: object
          required: [mode, stepResult]
          properties:
            mode: { type: string, const: BLIND }
            stepResult:
              oneOf: [{ $ref: '#/components/schemas/BlindStepResult' }, { type: 'null' }]
              description: 'Заполнено для `action: step`, иначе null'
      unevaluatedProperties: false
    OpenPlayerState:
      allOf:
        - $ref: '#/components/schemas/PlayerStateBase'
        - type: object
          required: [mode, stepResult]
          properties:
            mode: { type: string, const: OPEN }
            stepResult:
              oneOf: [{ $ref: '#/components/schemas/OpenStepResult' }, { type: 'null' }]
              description: 'Заполнено для `action: step`, иначе null'
    PlayerState:
      oneOf:
        - $ref: '#/components/schemas/BlindPlayerState'
        - $ref: '#/components/schemas/OpenPlayerState'
      discriminator:
        propertyName: mode
        mapping: { BLIND: '#/components/schemas/BlindPlayerState', OPEN: '#/components/schemas/OpenPlayerState' }
    # ---------- команды заявок ----------
    OrderParams:
      type: object
      description: |
        Цены передаются в шкале экрана; в слепом режиме перевод в рубли выполняет backend через `EstimateOrder`.
        Обязательные цены по `type`: `limit` — `limitPrice`; `stop` — `stopPrice`; `stop_limit` — `stopPrice` и `limitPrice`;
        `take_profit` — `takeProfitPrice`; `trailing` — `trailingPct`; `oco` — `stopPrice` и `takeProfitPrice`; `market` — без цен.
        Нарушение — отказ `INVALID_PARAMS` с полем `field`.
      properties:
        limitPrice: { $ref: '#/components/schemas/PriceOrNull' }
        stopPrice: { $ref: '#/components/schemas/PriceOrNull' }
        takeProfitPrice: { $ref: '#/components/schemas/PriceOrNull' }
        trailingPct: { $ref: '#/components/schemas/PctOrNull' }
    PlaceBlindOrderRequest:
      description: Заявка в слепой сессии — бумага по `paperIndex`
      allOf:
        - $ref: '#/components/schemas/OrderParams'
        - type: object
          required: [seenStep, paperIndex, side, type, lots, tif]
          properties:
            seenStep: { type: integer, minimum: 0 }
            paperIndex: { $ref: '#/components/schemas/PaperIndex' }
            side: { $ref: '#/components/schemas/OrderSide' }
            type: { $ref: '#/components/schemas/OrderType' }
            lots: { type: integer, minimum: 1 }
            tif: { $ref: '#/components/schemas/TimeInForce' }
    PlaceOpenOrderRequest:
      description: Заявка в раскрытой сессии — бумага по `paperId` из каталога
      allOf:
        - $ref: '#/components/schemas/OrderParams'
        - type: object
          required: [seenStep, paperId, side, type, lots, tif]
          properties:
            seenStep: { type: integer, minimum: 0 }
            paperId: { $ref: '#/components/schemas/Uuid' }
            side: { $ref: '#/components/schemas/OrderSide' }
            type: { $ref: '#/components/schemas/OrderType' }
            lots: { type: integer, minimum: 1 }
            tif: { $ref: '#/components/schemas/TimeInForce' }
    PlaceOrderRequest:
      description: 'Вид определяет режим сессии: `paperIndex` — слепая, `paperId` — раскрытая'
      oneOf:
        - $ref: '#/components/schemas/PlaceBlindOrderRequest'
        - $ref: '#/components/schemas/PlaceOpenOrderRequest'
    ReplaceOrderRequest:
      allOf:
        - $ref: '#/components/schemas/OrderParams'
        - type: object
          required: [seenStep, lots, tif]
          properties:
            seenStep: { type: integer, minimum: 0 }
            lots: { type: integer, minimum: 1 }
            tif: { $ref: '#/components/schemas/TimeInForce' }
    EstimateBlindOrderRequest:
      description: Оценка заявки в слепой сессии — бумага по `paperIndex`
      allOf:
        - $ref: '#/components/schemas/OrderParams'
        - type: object
          required: [paperIndex, side, type, lots, tif]
          properties:
            paperIndex: { $ref: '#/components/schemas/PaperIndex' }
            side: { $ref: '#/components/schemas/OrderSide' }
            type: { $ref: '#/components/schemas/OrderType' }
            lots: { type: integer, minimum: 1 }
            tif: { $ref: '#/components/schemas/TimeInForce' }
    EstimateOpenOrderRequest:
      description: Оценка заявки в раскрытой сессии — бумага по `paperId` из каталога
      allOf:
        - $ref: '#/components/schemas/OrderParams'
        - type: object
          required: [paperId, side, type, lots, tif]
          properties:
            paperId: { $ref: '#/components/schemas/Uuid' }
            side: { $ref: '#/components/schemas/OrderSide' }
            type: { $ref: '#/components/schemas/OrderType' }
            lots: { type: integer, minimum: 1 }
            tif: { $ref: '#/components/schemas/TimeInForce' }
    EstimateOrderRequest:
      oneOf:
        - $ref: '#/components/schemas/EstimateBlindOrderRequest'
        - $ref: '#/components/schemas/EstimateOpenOrderRequest'
    OrderEstimateBase:
      type: object
      required: [canPlace, reason, field, amountPct, commissionPct, exchangeFeePct, requiredCashPct]
      properties:
        canPlace: { type: boolean }
        reason:
          oneOf: [{ $ref: '#/components/schemas/RejectReason' }, { type: 'null' }]
        field: { type: [string, 'null'] }
        amountPct: { $ref: '#/components/schemas/Pct' }
        commissionPct: { $ref: '#/components/schemas/Pct' }
        exchangeFeePct: { $ref: '#/components/schemas/Pct' }
        requiredCashPct: { $ref: '#/components/schemas/Pct' }
    OrderEstimateLegBase:
      type: object
      description: Оценка одной ноги заявки; у OCO — отдельно стоп и тейк-профит
      required: [type, canPlace, reason, field, amountPct, commissionPct, exchangeFeePct, requiredCashPct]
      properties:
        type: { $ref: '#/components/schemas/OrderLegType' }
        canPlace: { type: boolean }
        reason:
          oneOf: [{ $ref: '#/components/schemas/RejectReason' }, { type: 'null' }]
        field: { type: [string, 'null'] }
        amountPct: { $ref: '#/components/schemas/Pct' }
        commissionPct: { $ref: '#/components/schemas/Pct' }
        exchangeFeePct: { $ref: '#/components/schemas/Pct' }
        requiredCashPct: { $ref: '#/components/schemas/Pct' }
    BlindOrderEstimateLeg:
      description: Нога оценки в слепом режиме — только проценты (INV-7)
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/OrderEstimateLegBase'
    OpenOrderEstimateLeg:
      description: Нога оценки в раскрытом режиме — проценты и рублёвые суммы
      allOf:
        - $ref: '#/components/schemas/OrderEstimateLegBase'
        - type: object
          required: [referencePrice, amount, commission, exchangeFee, requiredCash]
          properties:
            referencePrice: { $ref: '#/components/schemas/Price' }
            amount: { $ref: '#/components/schemas/Money' }
            commission: { $ref: '#/components/schemas/Money' }
            exchangeFee: { $ref: '#/components/schemas/Money' }
            requiredCash: { $ref: '#/components/schemas/Money' }
    BlindOrderEstimate:
      description: |
        Оценка заявки в слепом режиме — только проценты от начального капитала, без рублей и рублёвых цен (INV-7).
        Суммы верхнего уровня — первой ноги (у OCO — стоп), `canPlace`, `reason` и `field` — по всем ногам.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/OrderEstimateBase'
        - type: object
          required: [mode, legs]
          properties:
            mode: { type: string, const: BLIND }
            legs:
              type: array
              description: 'Оценка каждой ноги: одна нога, у OCO — стоп и тейк-профит; пусто, если оценки нет (отказ до расчёта, сессия не активна)'
              items: { $ref: '#/components/schemas/BlindOrderEstimateLeg' }
    OpenOrderEstimate:
      description: |
        Оценка заявки в раскрытом режиме — проценты и рублёвые суммы (`EstimateOrderResponse`).
        Суммы верхнего уровня — первой ноги (у OCO — стоп), `canPlace`, `reason` и `field` — по всем ногам.
      allOf:
        - $ref: '#/components/schemas/OrderEstimateBase'
        - type: object
          required: [mode, legs, referencePrice, amount, commission, exchangeFee, requiredCash]
          properties:
            mode: { type: string, const: OPEN }
            legs:
              type: array
              description: 'Оценка каждой ноги: одна нога, у OCO — стоп и тейк-профит; пусто, если оценки нет (отказ до расчёта, сессия не активна)'
              items: { $ref: '#/components/schemas/OpenOrderEstimateLeg' }
            referencePrice: { $ref: '#/components/schemas/Price' }
            amount: { $ref: '#/components/schemas/Money' }
            commission: { $ref: '#/components/schemas/Money' }
            exchangeFee: { $ref: '#/components/schemas/Money' }
            requiredCash: { $ref: '#/components/schemas/Money' }
    OrderEstimate:
      oneOf:
        - $ref: '#/components/schemas/BlindOrderEstimate'
        - $ref: '#/components/schemas/OpenOrderEstimate'
      discriminator:
        propertyName: mode
        mapping: { BLIND: '#/components/schemas/BlindOrderEstimate', OPEN: '#/components/schemas/OpenOrderEstimate' }
    OrderCommandResultBase:
      type: object
      description: 'Для OCO `order` — нога `stop`, обе ноги — в `orderIds`'
      required: [accepted, reason, field, orderIds]
      properties:
        accepted: { type: boolean }
        reason:
          oneOf: [{ $ref: '#/components/schemas/RejectReason' }, { type: 'null' }]
        field: { type: [string, 'null'] }
        orderIds:
          type: array
          description: Идентификаторы созданных заявок (для OCO — обе ноги)
          items: { $ref: '#/components/schemas/Uuid' }
    BlindOrderCommandResult:
      allOf:
        - $ref: '#/components/schemas/OrderCommandResultBase'
        - type: object
          required: [mode, order, orders, portfolio]
          properties:
            mode: { type: string, const: BLIND }
            order:
              oneOf: [{ $ref: '#/components/schemas/BlindOrder' }, { type: 'null' }]
            orders: { type: array, items: { $ref: '#/components/schemas/BlindOrder' } }
            portfolio: { $ref: '#/components/schemas/BlindPortfolio' }
      unevaluatedProperties: false
    OpenOrderCommandResult:
      allOf:
        - $ref: '#/components/schemas/OrderCommandResultBase'
        - type: object
          required: [mode, order, orders, portfolio]
          properties:
            mode: { type: string, const: OPEN }
            order:
              oneOf: [{ $ref: '#/components/schemas/OpenOrder' }, { type: 'null' }]
            orders: { type: array, items: { $ref: '#/components/schemas/OpenOrder' } }
            portfolio: { $ref: '#/components/schemas/OpenPortfolio' }
    OrderCommandResult:
      oneOf:
        - $ref: '#/components/schemas/BlindOrderCommandResult'
        - $ref: '#/components/schemas/OpenOrderCommandResult'
      discriminator:
        propertyName: mode
        mapping: { BLIND: '#/components/schemas/BlindOrderCommandResult', OPEN: '#/components/schemas/OpenOrderCommandResult' }
    FinishResultBase:
      type: object
      required: [sessionId, endReason, finishedAtStep, finishedAtDay]
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
        endReason:
          type: string
          description: 'Причина завершения: конец периода, досрочно по команде, банкротство (`SessionStatus.BANKRUPT`). Соответствие `HistoryStatus`: `period_end` — `completed`, `early` — `finished_early`, `bankrupt` — `bankrupt`'
          enum: [period_end, early, bankrupt]
        finishedAtStep: { type: integer }
        finishedAtDay: { type: integer }
    BlindFinishResult:
      allOf:
        - $ref: '#/components/schemas/FinishResultBase'
        - type: object
          required: [mode, portfolio, orders]
          properties:
            mode: { type: string, const: BLIND }
            portfolio: { $ref: '#/components/schemas/BlindPortfolio' }
            orders: { type: array, items: { $ref: '#/components/schemas/BlindOrder' } }
      unevaluatedProperties: false
    OpenFinishResult:
      allOf:
        - $ref: '#/components/schemas/FinishResultBase'
        - type: object
          required: [mode, portfolio, orders]
          properties:
            mode: { type: string, const: OPEN }
            portfolio: { $ref: '#/components/schemas/OpenPortfolio' }
            orders: { type: array, items: { $ref: '#/components/schemas/OpenOrder' } }
    FinishResult:
      oneOf:
        - $ref: '#/components/schemas/BlindFinishResult'
        - $ref: '#/components/schemas/OpenFinishResult'
      discriminator:
        propertyName: mode
        mapping: { BLIND: '#/components/schemas/BlindFinishResult', OPEN: '#/components/schemas/OpenFinishResult' }
    # ---------- SSE ----------
    SessionEvent:
      oneOf:
        - $ref: '#/components/schemas/StepEvent'
        - $ref: '#/components/schemas/OrderUpdatedEvent'
        - $ref: '#/components/schemas/PausedEvent'
        - $ref: '#/components/schemas/PlayerEvent'
        - $ref: '#/components/schemas/FinishedEvent'
        - $ref: '#/components/schemas/ReportReadyEvent'
      discriminator:
        propertyName: type
        mapping:
          step: '#/components/schemas/StepEvent'
          order_updated: '#/components/schemas/OrderUpdatedEvent'
          paused: '#/components/schemas/PausedEvent'
          player: '#/components/schemas/PlayerEvent'
          finished: '#/components/schemas/FinishedEvent'
          report_ready: '#/components/schemas/ReportReadyEvent'
    StepEvent:
      type: object
      unevaluatedProperties: false
      required: [type, eventId, result]
      properties:
        type: { type: string, const: step }
        eventId: { type: string, description: 'Равен строке `id:` SSE; монотонен в рамках сессии' }
        result: { $ref: '#/components/schemas/StepResult' }
    OrderUpdatedEventBase:
      type: object
      required: [type, eventId]
      properties:
        type: { type: string, const: order_updated }
        eventId: { type: string, description: 'Равен строке `id:` SSE; монотонен в рамках сессии' }
    BlindOrderUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/OrderUpdatedEventBase'
        - type: object
          required: [mode, order, portfolio]
          properties:
            mode: { type: string, const: BLIND }
            order: { $ref: '#/components/schemas/BlindOrder' }
            portfolio: { $ref: '#/components/schemas/BlindPortfolio' }
      unevaluatedProperties: false
    OpenOrderUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/OrderUpdatedEventBase'
        - type: object
          required: [mode, order, portfolio]
          properties:
            mode: { type: string, const: OPEN }
            order: { $ref: '#/components/schemas/OpenOrder' }
            portfolio: { $ref: '#/components/schemas/OpenPortfolio' }
    OrderUpdatedEvent:
      oneOf:
        - $ref: '#/components/schemas/BlindOrderUpdatedEvent'
        - $ref: '#/components/schemas/OpenOrderUpdatedEvent'
      discriminator:
        propertyName: mode
        mapping: { BLIND: '#/components/schemas/BlindOrderUpdatedEvent', OPEN: '#/components/schemas/OpenOrderUpdatedEvent' }
    PausedEvent:
      type: object
      description: 'Причина паузы. Пауза всегда публикуется парой: сначала `player` (`playing: false`), затем `paused` с причиной'
      unevaluatedProperties: false
      required: [type, eventId, reason]
      properties:
        type: { type: string, const: paused }
        eventId: { type: string, description: 'Равен строке `id:` SSE; монотонен в рамках сессии' }
        reason: { type: string, enum: [user, disconnect, worker_failure, restart], description: 'Причина паузы: команда пользователя, нет подписчиков, сбой воркера в такте, перезапуск сервера' }
    PlayerEvent:
      type: object
      unevaluatedProperties: false
      description: 'Смена состояния плеера (play, пауза, скорость) — для других вкладок. `playing: false` без следующего `paused` — завершение сессии (затем `finished`)'
      required: [type, eventId, playing, speed]
      properties:
        type: { type: string, const: player }
        eventId: { type: string, description: 'Равен строке `id:` SSE; монотонен в рамках сессии' }
        playing: { type: boolean }
        speed: { $ref: '#/components/schemas/PlayerSpeed' }
    FinishedEvent:
      type: object
      unevaluatedProperties: false
      required: [type, eventId, result]
      properties:
        type: { type: string, const: finished }
        eventId: { type: string, description: 'Равен строке `id:` SSE; монотонен в рамках сессии' }
        result: { $ref: '#/components/schemas/FinishResult' }
    ReportReadyEvent:
      type: object
      unevaluatedProperties: false
      required: [type, eventId, sessionId]
      properties:
        type: { type: string, const: report_ready }
        eventId: { type: string, description: 'Равен строке `id:` SSE; монотонен в рамках сессии' }
        sessionId: { $ref: '#/components/schemas/Uuid' }
    # ---------- воспроизведение ----------
    Period:
      type: object
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    ReplayMeta:
      type: object
      description: Только для раскрытой (завершённой) сессии, поэтому период допустим
      required: [sessionId, blind, period, regime, totalSteps, lastStep, totalDays]
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
        blind: { type: boolean }
        period: { $ref: '#/components/schemas/Period' }
        regime: { $ref: '#/components/schemas/Regime' }
        totalSteps: { type: integer }
        lastStep: { type: integer, description: 'Итоговый шаг: у досрочно завершённой и обанкротившейся сессии меньше `totalSteps`, дальше него воспроизведение не идёт' }
        totalDays: { type: integer }
    ReplayReadyBase:
      type: object
      required: [status, session]
      properties:
        status: { type: string, const: READY }
        session: { $ref: '#/components/schemas/ReplayMeta' }
    ReplaySnapshotReady:
      description: Ответ на запрос без `fromStep` — полный снимок на шаге `step`
      allOf:
        - $ref: '#/components/schemas/ReplayReadyBase'
        - type: object
          required: [kind, snapshot]
          properties:
            kind: { type: string, const: SNAPSHOT }
            snapshot: { $ref: '#/components/schemas/OpenSnapshot' }
    ReplayIncrementReady:
      description: Ответ на запрос с `fromStep` — приращение за `(fromStep; step]`
      allOf:
        - $ref: '#/components/schemas/ReplayReadyBase'
        - type: object
          required: [kind, increment]
          properties:
            kind: { type: string, const: INCREMENT }
            increment: { $ref: '#/components/schemas/OpenStepResult' }
    ReplayReady:
      oneOf:
        - $ref: '#/components/schemas/ReplaySnapshotReady'
        - $ref: '#/components/schemas/ReplayIncrementReady'
      discriminator:
        propertyName: kind
        mapping: { SNAPSHOT: '#/components/schemas/ReplaySnapshotReady', INCREMENT: '#/components/schemas/ReplayIncrementReady' }
    NotFinished:
      type: object
      description: Незавершённая сессия — без бумаг, периода и итога (INV-1, INV-7)
      unevaluatedProperties: false
      required: [status, sessionId, blind, title, createdAt, playedDays, totalDays, regime]
      properties:
        status: { type: string, const: NOT_FINISHED }
        sessionId: { $ref: '#/components/schemas/Uuid' }
        blind: { type: boolean }
        title: { type: string, description: 'Для слепой сессии: «Слепая сессия от ДД.ММ.ГГГГ»' }
        createdAt: { type: string, format: date-time }
        playedDays: { type: integer }
        totalDays: { type: integer }
        regime: { $ref: '#/components/schemas/Regime' }
    NotFound:
      type: object
      required: [status, sessionId]
      properties:
        status: { type: string, const: NOT_FOUND }
        sessionId: { $ref: '#/components/schemas/Uuid' }
    ReplayResult:
      oneOf:
        - $ref: '#/components/schemas/ReplayReady'
        - $ref: '#/components/schemas/NotFinished'
        - $ref: '#/components/schemas/NotFound'
      discriminator:
        propertyName: status
        mapping:
          READY: '#/components/schemas/ReplayReady'
          NOT_FINISHED: '#/components/schemas/NotFinished'
          NOT_FOUND: '#/components/schemas/NotFound'
    # ---------- отчёт ----------
    PaperReveal:
      type: object
      required: [id, blindLabel, ticker, name, sector, startPrice, lotSize]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        blindLabel: { type: string }
        ticker: { type: string }
        name: { type: string }
        sector: { type: string }
        startPrice: { $ref: '#/components/schemas/Price' }
        lotSize: { type: integer }
    CostsBreakdown:
      type: object
      required: [total, commission, exchangeFee, spread, slippage]
      properties:
        total: { $ref: '#/components/schemas/Money', description: 'Сумма четырёх видов издержек, считает core (core#54)' }
        commission: { $ref: '#/components/schemas/Money' }
        exchangeFee: { $ref: '#/components/schemas/Money' }
        spread: { $ref: '#/components/schemas/Money' }
        slippage: { $ref: '#/components/schemas/Money' }
    ReportMetrics:
      type: object
      description: 'Необязательные метрики (`optional` в ядре) — null: cagr, volatility, sharpe, sortino, winRate, benchmark'
      required: [initialCapital, finalCapital, totalReturnPct, cagrPct, grossReturnPct, netReturnPct, maxDrawdownPct, maxDrawdownDurationDays, maxDrawdownDurationSteps, volatilityPct, sharpe, sortino, turnover, tradesCount, winRatePct, rejectedOrdersCount, partialFillsCount, stopTakeSameBarCount, hhi, largestPositionPct, bankrupt, costs, benchmarkImoexPct]
      properties:
        initialCapital: { $ref: '#/components/schemas/Money' }
        finalCapital: { $ref: '#/components/schemas/Money' }
        totalReturnPct: { $ref: '#/components/schemas/Pct', description: 'Поле `total_return` ядра (отличие от `netReturnPct` задаёт ядро)' }
        cagrPct: { $ref: '#/components/schemas/PctOrNull' }
        grossReturnPct: { $ref: '#/components/schemas/Pct' }
        netReturnPct: { $ref: '#/components/schemas/Pct' }
        maxDrawdownPct: { $ref: '#/components/schemas/Pct' }
        maxDrawdownDurationDays: { type: integer, description: 'Число разных торговых дней в самой длинной серии шагов ниже пика, считает core (core#54)' }
        maxDrawdownDurationSteps: { type: integer }
        volatilityPct: { $ref: '#/components/schemas/PctOrNull' }
        sharpe: { $ref: '#/components/schemas/RatioOrNull' }
        sortino: { $ref: '#/components/schemas/RatioOrNull' }
        turnover: { $ref: '#/components/schemas/Ratio' }
        tradesCount: { type: integer, description: 'Число закрытых сделок (`round_trips` ядра)' }
        winRatePct: { $ref: '#/components/schemas/PctOrNull' }
        rejectedOrdersCount: { type: integer }
        partialFillsCount: { type: integer }
        stopTakeSameBarCount: { type: integer, description: 'Сделки, где стоп и тейк задеты одной свечой (исполнен стоп)' }
        hhi: { $ref: '#/components/schemas/Ratio' }
        largestPositionPct: { $ref: '#/components/schemas/Pct' }
        bankrupt: { type: boolean }
        costs: { $ref: '#/components/schemas/CostsBreakdown' }
        benchmarkImoexPct: { $ref: '#/components/schemas/PctOrNull' }
    Winner:
      type: string
      enum: [human, algo, tie]
    CapitalComparison:
      type: object
      required: [human, algo, winner, diff]
      properties:
        human: { $ref: '#/components/schemas/Money' }
        algo: { $ref: '#/components/schemas/Money' }
        winner: { $ref: '#/components/schemas/Winner' }
        diff: { $ref: '#/components/schemas/Money' }
    PctComparison:
      type: object
      required: [humanPct, algoPct, winner, diffPctPoints]
      properties:
        humanPct: { $ref: '#/components/schemas/Pct' }
        algoPct: { $ref: '#/components/schemas/Pct' }
        winner: { $ref: '#/components/schemas/Winner' }
        diffPctPoints: { $ref: '#/components/schemas/Pct' }
    Comparison:
      type: object
      description: Сравнение считается в core. Подписи вида «+1 200 ₽» формирует клиент из `diff`
      required: [finalCapital, netReturn, maxDrawdown]
      properties:
        finalCapital: { $ref: '#/components/schemas/CapitalComparison' }
        netReturn: { $ref: '#/components/schemas/PctComparison' }
        maxDrawdown: { $ref: '#/components/schemas/PctComparison' }
    EquityPoint:
      type: object
      required: [step, date, humanCapital, algoCapital, benchmarkCapital]
      properties:
        step: { type: integer }
        date: { type: string, format: date-time }
        humanCapital: { $ref: '#/components/schemas/Money' }
        algoCapital: { $ref: '#/components/schemas/MoneyOrNull', description: 'Капитал фонового алгоритма (ФТ-18); null, если на шаге нет точки или у старой сессии нет алгоритма' }
        benchmarkCapital: { $ref: '#/components/schemas/MoneyOrNull' }
    UnderwaterPoint:
      type: object
      required: [step, date, humanDrawdownPct, algoDrawdownPct]
      properties:
        step: { type: integer }
        date: { type: string, format: date-time }
        humanDrawdownPct: { $ref: '#/components/schemas/Pct', description: 'Глубина просадки от пика в %, считает core (core#54)' }
        algoDrawdownPct: { $ref: '#/components/schemas/PctOrNull', description: 'Просадка фонового алгоритма в % (ФТ-18); null, если на шаге нет точки или у старой сессии нет алгоритма' }
    DivergenceType:
      type: string
      enum: [extra, missed, size, timing]
    TradeAction:
      type: object
      description: Структурированное действие; текст («Купить 3 лота…») собирает клиент
      required: [kind, side, lots, orderType]
      properties:
        kind: { type: string, enum: [trade, none] }
        side:
          oneOf: [{ $ref: '#/components/schemas/OrderSide' }, { type: 'null' }]
        lots: { type: [integer, 'null'] }
        orderType:
          description: 'В сравнении участвуют только рыночные и лимитные заявки; защитные, OCO и отмены не учитываются (`decisions.md`, «Разбор расхождений»)'
          oneOf: [{ type: string, enum: [market, limit] }, { type: 'null' }]
    Divergence:
      type: object
      description: Разбор расхождений считает core; `id` — детерминированный UUID v5 (сессия, вид, номер в ядре)
      required: [id, step, day, date, paperTicker, sector, type, deltaBars, horizonStep, horizonDay, humanAction, algoAction, errorCost, errorCostPct, because]
      properties:
        id: { $ref: '#/components/schemas/DerivedUuid' }
        step: { type: integer }
        day: { type: integer }
        date: { type: string, format: date-time }
        paperTicker: { type: string }
        sector: { type: string }
        type: { $ref: '#/components/schemas/DivergenceType' }
        deltaBars: { type: [integer, 'null'] }
        horizonStep: { type: integer }
        horizonDay: { type: integer }
        humanAction: { $ref: '#/components/schemas/TradeAction' }
        algoAction: { $ref: '#/components/schemas/TradeAction' }
        errorCost: { $ref: '#/components/schemas/Money' }
        errorCostPct: { $ref: '#/components/schemas/Pct' }
        because: { type: [string, 'null'], description: 'Текст `because` правила алгоритма (`decisions.md`, «Разбор расхождений»); null для «лишнего действия» — фразу подставляет клиент' }
    DivergenceSummary:
      type: object
      required: [totalErrorCost, totalErrorCostPct, worstDivergenceId, worstType, worstDay, worstErrorCost]
      properties:
        totalErrorCost: { $ref: '#/components/schemas/Money' }
        totalErrorCostPct: { $ref: '#/components/schemas/Pct' }
        worstDivergenceId: { $ref: '#/components/schemas/DerivedUuidOrNull' }
        worstType:
          oneOf: [{ $ref: '#/components/schemas/DivergenceType' }, { type: 'null' }]
        worstDay: { type: [integer, 'null'] }
        worstErrorCost: { $ref: '#/components/schemas/MoneyOrNull' }
    ReverseCheckTrade:
      type: object
      description: Обратная проверка считается в core; `id` и `entryDivergenceId` — детерминированные UUID v5
      required: [id, paperTicker, entryStep, entryDay, entryDate, exitStep, exitDay, exitDate, lots, entryPrice, exitPrice, netProfit, entryDivergenceId]
      properties:
        id: { $ref: '#/components/schemas/DerivedUuid' }
        paperTicker: { type: string }
        entryStep: { type: integer }
        entryDay: { type: integer }
        entryDate: { type: string, format: date-time }
        exitStep: { type: integer }
        exitDay: { type: integer }
        exitDate: { type: string, format: date-time }
        lots: { type: integer }
        entryPrice: { $ref: '#/components/schemas/Price' }
        exitPrice: { $ref: '#/components/schemas/Price' }
        netProfit: { $ref: '#/components/schemas/Money' }
        entryDivergenceId: { $ref: '#/components/schemas/DerivedUuid' }
    RoundTrip:
      type: object
      description: Закрытая сделка — пара покупка → продажа по FIFO (`Report.round_trips` ядра, не пересчитывается в Java)
      required: [paperTicker, entryStep, exitStep, entryDate, exitDate, lots, entryPrice, exitPrice, grossPnl, costs, netPnl]
      properties:
        paperTicker: { type: string }
        entryStep: { type: integer }
        exitStep: { type: integer }
        entryDate: { type: string, format: date-time }
        exitDate: { type: string, format: date-time }
        lots: { type: integer }
        entryPrice: { $ref: '#/components/schemas/Price' }
        exitPrice: { $ref: '#/components/schemas/Price' }
        grossPnl: { $ref: '#/components/schemas/Money' }
        costs: { $ref: '#/components/schemas/Money' }
        netPnl: { $ref: '#/components/schemas/Money' }
    ReportFill:
      type: object
      description: '`id` — детерминированный UUID v5 (сессия, вид, номер в ядре)'
      required: [id, day, date, paperTicker, side, orderType, lots, price, cost, partial]
      properties:
        id: { $ref: '#/components/schemas/DerivedUuid' }
        day: { type: integer }
        date: { type: string, format: date-time }
        paperTicker: { type: string }
        side: { $ref: '#/components/schemas/OrderSide' }
        orderType: { $ref: '#/components/schemas/OrderLegType' }
        lots: { type: integer }
        price: { $ref: '#/components/schemas/Price' }
        cost: { $ref: '#/components/schemas/Money', description: 'Общие издержки исполнения, считает core (core#54)' }
        partial: { type: boolean }
    SessionReport:
      type: object
      description: Раскрытый отчёт; существует только для завершённой сессии (INV-1, INV-7). Бенчмарк — ценовой индекс IMOEX, дивиденды не начисляются
      required: [sessionId, blind, finishedEarly, replayAvailable, playedDays, totalDays, timeframe, regime, createdAt, backgroundAlgorithmName, period, papers, humanMetrics, algoMetrics, comparison, equityCurve, underwaterCurve, divergenceSummary, divergences, reverseCheckTrades, roundTrips, fills]
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
        blind: { type: boolean }
        finishedEarly: { type: boolean }
        replayAvailable: { type: boolean }
        playedDays: { type: integer }
        totalDays: { type: integer }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        regime: { $ref: '#/components/schemas/Regime' }
        createdAt: { type: string, format: date-time }
        backgroundAlgorithmName: { type: [string, 'null'], description: 'Название фонового алгоритма сессии (ФТ-18); null для старых сессий без алгоритма' }
        period: { $ref: '#/components/schemas/Period' }
        papers: { type: array, items: { $ref: '#/components/schemas/PaperReveal' } }
        humanMetrics: { $ref: '#/components/schemas/ReportMetrics' }
        algoMetrics: { oneOf: [{ $ref: '#/components/schemas/ReportMetrics' }, { type: 'null' }], description: 'Метрики фонового алгоритма (ФТ-18); null для старых сессий без алгоритма' }
        comparison: { oneOf: [{ $ref: '#/components/schemas/Comparison' }, { type: 'null' }], description: 'Сравнение результатов человека и фонового алгоритма (ФТ-18); null для старых сессий без алгоритма' }
        equityCurve: { type: array, items: { $ref: '#/components/schemas/EquityPoint' } }
        underwaterCurve: { type: array, items: { $ref: '#/components/schemas/UnderwaterPoint' }, description: 'Кривая просадки: точка на каждую точку `equityCurve`, считает core (core#54)' }
        divergenceSummary: { oneOf: [{ $ref: '#/components/schemas/DivergenceSummary' }, { type: 'null' }], description: 'Сводка по расхождениям (ФТ-19); null для старых сессий без алгоритма' }
        divergences: { oneOf: [{ type: array, items: { $ref: '#/components/schemas/Divergence' } }, { type: 'null' }], description: 'Список расхождений (ФТ-18…19); null для старых сессий без алгоритма' }
        reverseCheckTrades: { oneOf: [{ type: array, items: { $ref: '#/components/schemas/ReverseCheckTrade' } }, { type: 'null' }], description: 'Пропущенные алгоритмом прибыльные сделки человека (ФТ-20); null для старых сессий без алгоритма' }
        roundTrips: { type: array, items: { $ref: '#/components/schemas/RoundTrip' } }
        fills: { type: array, items: { $ref: '#/components/schemas/ReportFill' } }
    ReportReady:
      type: object
      required: [status, report]
      properties:
        status: { type: string, const: READY }
        report: { $ref: '#/components/schemas/SessionReport' }
    ReportBuilding:
      type: object
      required: [status, sessionId]
      properties:
        status: { type: string, const: BUILDING }
        sessionId: { $ref: '#/components/schemas/Uuid' }
    ReportResult:
      oneOf:
        - $ref: '#/components/schemas/ReportReady'
        - $ref: '#/components/schemas/ReportBuilding'
        - $ref: '#/components/schemas/NotFinished'
        - $ref: '#/components/schemas/NotFound'
      discriminator:
        propertyName: status
        mapping:
          READY: '#/components/schemas/ReportReady'
          BUILDING: '#/components/schemas/ReportBuilding'
          NOT_FINISHED: '#/components/schemas/NotFinished'
          NOT_FOUND: '#/components/schemas/NotFound'
    CompareSessionRequest:
      type: object
      required: [algorithmIds]
      properties:
        algorithmIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
          description: Идентификаторы стратегий из каталога Мастерской (порядок сохраняется)
    HumanEquityPoint:
      type: object
      required: [step, date, humanCapital, benchmarkCapital]
      properties:
        step: { type: integer }
        date: { type: string, format: date-time }
        humanCapital: { $ref: '#/components/schemas/Money' }
        benchmarkCapital: { $ref: '#/components/schemas/MoneyOrNull' }
    ComparedAlgorithmReport:
      type: object
      required:
        - algorithmId
        - strategyVersionId
        - algorithmName
        - version
        - algoMetrics
        - comparison
        - equityCurve
        - underwaterCurve
        - divergenceSummary
        - divergences
        - reverseCheckTrades
      properties:
        algorithmId: { $ref: '#/components/schemas/Uuid' }
        strategyVersionId: { $ref: '#/components/schemas/Uuid' }
        algorithmName: { type: string }
        version: { type: integer, minimum: 1 }
        algoMetrics: { $ref: '#/components/schemas/ReportMetrics' }
        comparison: { $ref: '#/components/schemas/Comparison' }
        equityCurve: { type: array, items: { $ref: '#/components/schemas/EquityPoint' } }
        underwaterCurve: { type: array, items: { $ref: '#/components/schemas/UnderwaterPoint' } }
        divergenceSummary: { $ref: '#/components/schemas/DivergenceSummary' }
        divergences: { type: array, items: { $ref: '#/components/schemas/Divergence' } }
        reverseCheckTrades: { type: array, items: { $ref: '#/components/schemas/ReverseCheckTrade' } }
    ConsensusItem:
      type: object
      description: Сводное согласие выбранных алгоритмов на шаге (маппинг `ConsensusItem` из core)
      required: [step, day, date, paperTicker, side, humanAction, agreeing, total, medianCost]
      properties:
        step: { type: integer }
        day: { type: integer }
        date: { type: string, format: date-time }
        paperTicker: { type: string }
        side: { $ref: '#/components/schemas/OrderSide' }
        humanAction: { type: boolean }
        agreeing: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        medianCost: { $ref: '#/components/schemas/Money' }
    SessionCompareResponse:
      type: object
      description: Постфактум-сравнение завершённой сессии с 1–5 алгоритмами (UC-9 п. 1а/1б)
      required: [sessionId, humanMetrics, humanEquityCurve, algorithms, consensus]
      properties:
        sessionId: { $ref: '#/components/schemas/Uuid' }
        humanMetrics: { $ref: '#/components/schemas/ReportMetrics' }
        humanEquityCurve: { type: array, items: { $ref: '#/components/schemas/HumanEquityPoint' } }
        algorithms:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/ComparedAlgorithmReport' }
        consensus: { type: array, items: { $ref: '#/components/schemas/ConsensusItem' } }
    # ---------- история ----------
    HistoryEntryBase:
      type: object
      required: [id, kind, owner, createdAt, regime, playedDays, totalDays, algoName, blind, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [session, algo_run] }
        owner: { type: string, enum: [USER], description: 'В историю попадают только прогоны пользователя (`decisions.md`, «Отчёт и история»)' }
        createdAt: { type: string, format: date-time }
        regime: { $ref: '#/components/schemas/Regime' }
        playedDays: { type: integer }
        totalDays: { type: integer }
        algoName: { type: [string, 'null'] }
        blind: { type: boolean }
        status: { $ref: '#/components/schemas/HistoryStatus' }
    HistoryEntryBlindUnfinished:
      description: INV-7 — без бумаг, периода, названия и итога; полей раскрытия в схеме нет
      allOf:
        - $ref: '#/components/schemas/HistoryEntryBase'
        - type: object
          required: [view, blind, status]
          properties:
            view: { type: string, const: BLIND_UNFINISHED }
            blind: { type: boolean, const: true }
            status: { type: string, const: running }
      unevaluatedProperties: false
    HistoryEntryRevealed:
      description: |
        Раскрытая запись (завершённая либо неслепая); у незавершённой неслепой `netReturnPct` равен null (INV-1).
        Сочетание `blind: true` и `status: running` запрещено — такая запись валидна только как `HistoryEntryBlindUnfinished`.
      not:
        required: [blind, status]
        properties:
          blind: { const: true }
          status: { const: running }
      allOf:
        - $ref: '#/components/schemas/HistoryEntryBase'
        - type: object
          required: [view, title, papers, period, netReturnPct]
          properties:
            view: { type: string, const: REVEALED }
            title: { type: string }
            papers: { type: array, items: { type: string } }
            period: { $ref: '#/components/schemas/Period' }
            netReturnPct: { $ref: '#/components/schemas/PctOrNull' }
    HistoryEntry:
      description: "Незавершённая слепая запись ('blind: true', 'status: running') — без раскрытых полей"
      oneOf:
        - $ref: '#/components/schemas/HistoryEntryBlindUnfinished'
        - $ref: '#/components/schemas/HistoryEntryRevealed'
      discriminator:
        propertyName: view
        mapping: { BLIND_UNFINISHED: '#/components/schemas/HistoryEntryBlindUnfinished', REVEALED: '#/components/schemas/HistoryEntryRevealed' }
    HistoryPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    # ---------- мастерская ----------
    WorkshopSortField:
      type: string
      enum: [published_desc, name_asc, author_asc]
    WorkshopLicense:
      type: string
      enum: [MIT]
    WorkshopVisibility:
      type: string
      enum: [public, closed, hidden]
      description: |
        Уровень видимости алгоритма в Мастерской:
        - `public` — публичный (видят все, исходный код открыт, доступен форк и запуск)
        - `closed` — закрытый код (видят, запускают и сравнивают все, исходный код скрыт от других и форк запрещён; автор всегда видит и редактирует свой код)
        - `hidden` — приватный (видит и запускает только автор)
    CheckLevel:
      type: string
      enum: [OK, WARNING, ERROR]
    TextEdit:
      type: object
      required: [startLine, startColumn, endLine, endColumn, replacement]
      properties:
        startLine: { type: integer, minimum: 1 }
        startColumn: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        endColumn: { type: integer, minimum: 1 }
        replacement: { type: string }
    DiagnosticFix:
      type: object
      required: [description, edits]
      properties:
        description: { type: string }
        edits: { type: array, items: { $ref: '#/components/schemas/TextEdit' } }
    StrategyDiagnostic:
      type: object
      required: [code, level, startLine, startColumn, endLine, endColumn, message, fixes]
      properties:
        code: { type: string }
        level: { $ref: '#/components/schemas/CheckLevel' }
        startLine: { type: integer, minimum: 0 }
        startColumn: { type: integer, minimum: 0 }
        endLine: { type: integer, minimum: 0 }
        endColumn: { type: integer, minimum: 0 }
        message: { type: string }
        fixes: { type: array, items: { $ref: '#/components/schemas/DiagnosticFix' } }
    StrategyParamDecl:
      type: object
      required: [name, defaultValue, rangeMin, rangeMax, step, integer]
      properties:
        name: { type: string }
        defaultValue: { type: number }
        rangeMin: { type: [number, 'null'] }
        rangeMax: { type: [number, 'null'] }
        step: { type: [string, 'null'] }
        integer: { type: boolean }
    CheckStrategyRequest:
      type: object
      required: [source]
      properties:
        source: { type: string }
        paramOverrides:
          type: object
          additionalProperties: { type: number }
    CheckStrategyResult:
      type: object
      required: [lookaheadLevel, diagnostics, params]
      properties:
        lookaheadLevel: { $ref: '#/components/schemas/CheckLevel' }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/StrategyDiagnostic' } }
        params: { type: array, items: { $ref: '#/components/schemas/StrategyParamDecl' } }
    WorkshopLinterWarning:
      type: object
      required: [code, line, message]
      properties:
        code: { type: string }
        line: { type: integer }
        message: { type: string }
    WorkshopAlgorithmVersion:
      type: object
      description: INV-5 — опубликованные версии алгоритма неизменяемы
      required: [version, publishedAt, summary, immutable]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        summary: { type: string }
        immutable: { type: boolean, const: true }
        source:
          type: [string, 'null']
          description: Исходный DSL-код версии; `null` для алгоритмов с `visibility = closed` при просмотре не-автором.
        lookaheadLevel: { $ref: '#/components/schemas/CheckLevel' }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/StrategyDiagnostic' } }
        params: { type: array, items: { $ref: '#/components/schemas/StrategyParamDecl' } }
    WorkshopAuthorOption:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
    WorkshopForkSource:
      type: object
      required: [versionId, strategyId, strategyName, authorName, version]
      properties:
        versionId: { $ref: '#/components/schemas/Uuid' }
        strategyId: { $ref: '#/components/schemas/Uuid' }
        strategyName: { type: string }
        authorName: { type: string }
        version: { type: integer, minimum: 1 }
    WorkshopAlgorithmSummary:
      type: object
      required: [id, name, description, authorId, author, isMine, isSystem, visibility, latestVersion, latestVersionId, versionsCount, publishedAt, license, lookaheadLevel, hasLinterWarnings, linterWarnings, forkedFrom]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string }
        authorId: { $ref: '#/components/schemas/Uuid' }
        author: { type: string }
        isMine: { type: boolean }
        isSystem: { type: boolean }
        visibility: { $ref: '#/components/schemas/WorkshopVisibility' }
        latestVersion: { type: integer, minimum: 0 }
        latestVersionId: { $ref: '#/components/schemas/UuidOrNull' }
        versionsCount: { type: integer, minimum: 0 }
        publishedAt: { type: [string, 'null'], format: date-time }
        license: { $ref: '#/components/schemas/WorkshopLicense' }
        lookaheadLevel:
          oneOf:
            - $ref: '#/components/schemas/CheckLevel'
            - { type: 'null' }
        hasLinterWarnings: { type: boolean }
        linterWarnings: { type: array, items: { $ref: '#/components/schemas/WorkshopLinterWarning' } }
        forkedFrom:
          oneOf:
            - $ref: '#/components/schemas/WorkshopForkSource'
            - { type: 'null' }
    WorkshopAlgorithmDetail:
      allOf:
        - $ref: '#/components/schemas/WorkshopAlgorithmSummary'
        - type: object
          required: [versions]
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/WorkshopAlgorithmVersion' } }
    WorkshopDetailReady:
      type: object
      required: [status, algorithm]
      properties:
        status: { type: string, const: READY }
        algorithm: { $ref: '#/components/schemas/WorkshopAlgorithmDetail' }
    WorkshopDetailNotFound:
      type: object
      required: [status]
      properties:
        status: { type: string, const: NOT_FOUND }
    WorkshopDetailResult:
      oneOf:
        - $ref: '#/components/schemas/WorkshopDetailReady'
        - $ref: '#/components/schemas/WorkshopDetailNotFound'
      discriminator:
        propertyName: status
        mapping:
          READY: '#/components/schemas/WorkshopDetailReady'
          NOT_FOUND: '#/components/schemas/WorkshopDetailNotFound'
    WorkshopPage:
      type: object
      required: [items, authors, total, page, pageSize, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkshopAlgorithmSummary' } }
        authors: { type: array, items: { $ref: '#/components/schemas/WorkshopAuthorOption' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    CreateWorkshopAlgorithmRequest:
      type: object
      required: [name, source]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        source: { type: string }
        visibility:
          $ref: '#/components/schemas/WorkshopVisibility'
          default: public
    UpdateWorkshopDraftRequest:
      type: object
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 2000 }
        source: { type: [string, 'null'] }
    WorkshopDraft:
      type: object
      required: [strategyId, name, description, visibility, forkedFrom, source, check, updatedAt, latestVersion]
      properties:
        strategyId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/WorkshopVisibility' }
        forkedFrom:
          oneOf:
            - $ref: '#/components/schemas/WorkshopForkSource'
            - { type: 'null' }
        source: { type: string }
        updatedAt: { type: string, format: date-time }
        latestVersion: { type: integer, minimum: 0 }
        check:
          oneOf:
            - $ref: '#/components/schemas/CheckStrategyResult'
            - { type: 'null' }
    PublishWorkshopAlgorithmRequest:
      type: object
      properties:
        summary: { type: string, maxLength: 500 }
        source: { type: [string, 'null'] }
    ForkWorkshopAlgorithmRequest:
      type: object
      properties:
        version: { type: [integer, 'null'], minimum: 1 }
        name: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 2000 }
    UpdateWorkshopVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility: { $ref: '#/components/schemas/WorkshopVisibility' }
    # ---------- прогоны алгоритмов ----------
    RunStatus:
      type: string
      enum: [queued, running, completed, bankrupt, invalid, failed]
    CreateRunRequest:
      type: object
      required: [strategyVersionId, durationDays, timeframe, regime, startMode, customStartDate, paperCount, paperIds, initialCapital]
      properties:
        strategyVersionId: { $ref: '#/components/schemas/Uuid' }
        paramOverrides:
          type: object
          additionalProperties: { type: number }
        blind: { type: boolean, default: false }
        durationDays: { type: integer, enum: [20, 60, 120, 250] }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        regime: { $ref: '#/components/schemas/Regime' }
        startMode: { type: string, enum: [random, custom] }
        customStartDate: { type: [string, 'null'], format: date, description: Только для custom }
        paperCount: { type: [integer, 'null'] }
        paperIds:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Uuid' }
        initialCapital: { $ref: '#/components/schemas/Money' }
        dailyLossLimitPct:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100
          description: Необязательный лимит дневного убытка в % от капитала начала торгового дня (kill-switch); null или отсутствие поля — отключён
    CreatedRun:
      type: object
      required: [runId]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
    CreateCompareRunsRequest:
      type: object
      required: [algorithmIds, durationDays, timeframe, regime, startMode, initialCapital]
      properties:
        algorithmIds:
          type: array
          minItems: 2
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
          description: Идентификаторы стратегий из каталога Мастерской (2–5 уникальных, порядок сохраняется)
        blind: { type: boolean, default: false }
        durationDays: { type: integer, enum: [20, 60, 120, 250] }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        regime: { $ref: '#/components/schemas/Regime' }
        startMode: { type: string, enum: [random, custom] }
        customStartDate: { type: [string, 'null'], format: date, description: Только для custom }
        paperCount: { type: [integer, 'null'] }
        paperIds:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Uuid' }
        initialCapital: { $ref: '#/components/schemas/Money' }
        dailyLossLimitPct:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100
          description: Необязательный лимит дневного убытка в % от капитала начала торгового дня (kill-switch); null или отсутствие поля — отключён
    CompareRunPaper:
      type: object
      required: [id, ticker, name]
      properties:
        id: { $ref: '#/components/schemas/UuidOrNull' }
        ticker: { type: string }
        name: { type: string }
    CompareRunItem:
      type: object
      required: [algorithmId, algorithmName, versionId, runId, status]
      properties:
        algorithmId: { $ref: '#/components/schemas/Uuid' }
        algorithmName: { type: string }
        versionId: { $ref: '#/components/schemas/Uuid' }
        runId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/RunStatus' }
    CompareRunsResponse:
      type: object
      description: Результат пакетного запуска 2–5 алгоритмов на одном отрезке; в слепом режиме даты и тикеры скрыты (INV-7)
      required: [startDate, endDate, timeframe, durationDays, initialCapital, blind, papers, runs]
      properties:
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        durationDays: { type: integer }
        initialCapital: { $ref: '#/components/schemas/Money' }
        blind: { type: boolean }
        papers:
          type: array
          items: { $ref: '#/components/schemas/CompareRunPaper' }
        runs:
          type: array
          minItems: 2
          maxItems: 5
          items: { $ref: '#/components/schemas/CompareRunItem' }
    RunInfo:
      type: object
      description: Состояние прогона; в слепом режиме период и бумаги не раскрываются до завершения (INV-7)
      required: [runId, strategyVersionId, algoName, blind, status, doneSteps, totalSteps, repeatOfRunId, repeatMatch, lastEventId, createdAt, finishedAt, errorCode, period, papers]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        strategyVersionId: { $ref: '#/components/schemas/Uuid' }
        algoName: { type: string }
        blind: { type: boolean }
        status: { $ref: '#/components/schemas/RunStatus' }
        doneSteps: { type: integer, minimum: 0 }
        totalSteps: { type: [integer, 'null'], minimum: 0 }
        repeatOfRunId: { $ref: '#/components/schemas/UuidOrNull' }
        repeatMatch: { type: [boolean, 'null'] }
        lastEventId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        errorCode: { type: [string, 'null'] }
        dailyLossLimitPct:
          type: [number, 'null']
          description: Заданный лимит дневного убытка в % (kill-switch) или null, если отключён
        killSwitchTriggered:
          type: boolean
          description: Признак срабатывания лимита дневного убытка (kill-switch)
        diagnostics: { type: array, items: { $ref: '#/components/schemas/StrategyDiagnostic' } }
        period:
          oneOf:
            - $ref: '#/components/schemas/Period'
            - { type: 'null' }
        papers:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/PaperReveal' }
            - { type: 'null' }
    RunEvent:
      oneOf:
        - $ref: '#/components/schemas/RunProgressEvent'
        - $ref: '#/components/schemas/RunFinishedEvent'
        - $ref: '#/components/schemas/RunFailedEvent'
        - $ref: '#/components/schemas/RunReportReadyEvent'
