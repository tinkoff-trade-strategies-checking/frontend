        propertyName: type
        mapping:
          run_progress: '#/components/schemas/RunProgressEvent'
          run_finished: '#/components/schemas/RunFinishedEvent'
          run_failed: '#/components/schemas/RunFailedEvent'
          report_ready: '#/components/schemas/RunReportReadyEvent'
    RunProgressEvent:
      type: object
      unevaluatedProperties: false
      required: [type, eventId, doneSteps, totalSteps]
      properties:
        type: { type: string, const: run_progress }
        eventId: { type: string }
        doneSteps: { type: integer, minimum: 0 }
        totalSteps: { type: integer, minimum: 0 }
    RunFinishedEvent:
      type: object
      unevaluatedProperties: false
      required: [type, eventId, status, repeatMatch]
      properties:
        type: { type: string, const: run_finished }
        eventId: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        repeatMatch: { type: [boolean, 'null'] }
    RunFailedEvent:
      type: object
      unevaluatedProperties: false
      required: [type, eventId, errorCode]
      properties:
        type: { type: string, const: run_failed }
        eventId: { type: string }
        errorCode: { type: string }
    RunReportReadyEvent:
      type: object
      unevaluatedProperties: false
      required: [type, eventId, runId]
      properties:
        type: { type: string, const: report_ready }
        eventId: { type: string }
        runId: { $ref: '#/components/schemas/Uuid' }
    StrategyFinding:
      type: object
      required: [code, level, message, step]
      properties:
        code: { type: string }
        level: { $ref: '#/components/schemas/CheckLevel' }
        message: { type: string }
        step: { type: integer }
    RunOrder:
      type: object
