      properties:
        id: { type: integer }
        paperTicker: { type: string }
        side: { $ref: '#/components/schemas/OrderSide' }
        orderType: { $ref: '#/components/schemas/OrderLegType' }
        lots: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        placedStep: { type: integer }
        closedStep: { type: [integer, 'null'] }
        limitPrice: { $ref: '#/components/schemas/PriceOrNull' }
        stopPrice: { $ref: '#/components/schemas/PriceOrNull' }
        trailingPct: { $ref: '#/components/schemas/PctOrNull' }
        ruleName: { type: string }
        because: { type: string }
    RunEquityPoint:
      type: object
      required: [step, date, capital, benchmarkCapital]
      properties:
        step: { type: integer }
        date: { type: string, format: date-time }
        capital: { $ref: '#/components/schemas/Money' }
        benchmarkCapital: { $ref: '#/components/schemas/MoneyOrNull' }
    RunUnderwaterPoint:
      type: object
      required: [step, date, drawdownPct]
      properties:
        step: { type: integer }
        date: { type: string, format: date-time }
        drawdownPct: { $ref: '#/components/schemas/Pct' }
    AlgoRunReport:
      type: object
      description: Раскрытый отчёт завершённого прогона алгоритма (INV-1, INV-4, INV-7)
      required: [runId, strategyVersionId, algoName, blind, status, playedDays, totalDays, timeframe, regime, createdAt, repeatOfRunId, repeatMatch, level, findings, diagnostics, period, papers, metrics, equityCurve, underwaterCurve, roundTrips, fills, orders]
