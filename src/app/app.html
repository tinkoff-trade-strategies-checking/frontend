<tui-root [attr.tuiTheme]="theme()">
  <header class="header">
    <div class="brand">
      <svg
        class="brand-logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
        fill="none"
        aria-hidden="true"
      >
        <rect x="4" y="4" width="56" height="56" rx="15" fill="#2563EB" />
        <rect x="14" y="34" width="7" height="14" rx="2.5" fill="#FFFFFF" opacity="0.72" />
        <rect x="24" y="25" width="7" height="23" rx="2.5" fill="#FFFFFF" opacity="0.9" />
        <rect x="34" y="17" width="7" height="31" rx="2.5" fill="#FFFFFF" />
        <rect
          x="44"
          y="22"
          width="6.5"
          height="26"
          rx="2"
          stroke="#FFFFFF"
          stroke-width="1.75"
          stroke-dasharray="3 2.5"
          opacity="0.55"
        />
        <path d="M13 49H51" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      </svg>
      <div class="brand-text">
        <span class="brand-title">Честная проверка</span>
        <span class="brand-badge">Тренажёр стратегий</span>
      </div>
    </div>

    @if (showNav()) {
      <nav class="nav" aria-label="Основная навигация">
        @for (section of sections(); track section.title) {
          <a
            tuiButton
            size="s"
            appearance="flat"
            class="nav-link"
            [class.active]="isSectionActive(section.activePrefix)"
            [attr.aria-current]="isSectionActive(section.activePrefix) ? 'page' : null"
            [routerLink]="section.path"
          >
            {{ section.title }}
          </a>
        }
      </nav>
    }

    <div class="header-actions">
      <tui-segmented
        size="s"
        class="mode-switcher"
        aria-label="Режим интерфейса"
        [activeItemIndex]="uiMode() === 'pro' ? 1 : 0"
        (activeItemIndexChange)="onUiModeIndexChange($event)"
      >
        <button id="mode-basic" type="button">Базовый</button>
        <button id="mode-pro" type="button">Профи</button>
      </tui-segmented>

      <button
        id="glossary-toggle"
        tuiButton
        type="button"
        size="s"
        appearance="outline"
        class="glossary-toggle"
        aria-label="Открыть словарь инвестора"
        (click)="openGlossary()"
      >
        <span class="glossary-icon" aria-hidden="true">?</span>
        <span>Словарь</span>
      </button>

      <button
        id="theme-toggle"
        tuiButton
        type="button"
        size="s"
        appearance="outline"
        class="theme-toggle"
        [attr.aria-label]="
          theme() === 'dark' ? 'Переключить на светлую тему' : 'Переключить на тёмную тему'
        "
        (click)="toggleTheme()"
      >
        <tui-icon [icon]="theme() === 'dark' ? '@tui.sun' : '@tui.moon'" />
        <span>{{ theme() === 'dark' ? 'Светлая' : 'Тёмная' }}</span>
      </button>

      @if (user(); as currentUser) {
        <div class="user">
          <span class="user-email tui-text_body-s">{{ currentUser.email }}</span>
          <button tuiButton type="button" size="s" appearance="outline" (click)="logout()">
            Выйти
          </button>
        </div>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <app-beginner-glossary [open]="glossaryOpen()" (closed)="closeGlossary()" />
</tui-root>
