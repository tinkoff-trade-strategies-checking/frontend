<div class="glossary-overlay">
  <button
    type="button"
    class="glossary-backdrop"
    aria-label="Закрыть словарь"
    (click)="close()"
  ></button>
  <aside class="glossary-drawer" role="dialog" aria-modal="true" aria-label="Словарь терминов">
    <header class="glossary-header">
      <div>
        <h2 class="tui-text_h5">Словарь терминов</h2>
        <p class="tui-text_body-xs muted">Короткие объяснения без сложного жаргона</p>
      </div>
      <button tuiButton type="button" size="xs" appearance="flat" (click)="close()">Закрыть</button>
    </header>

    <tui-segmented
      size="s"
      class="glossary-tabs"
      [activeItemIndex]="activeTabIndex()"
      (activeItemIndexChange)="onTabIndexChange($event)"
    >
      @for (tab of tabs; track tab.id) {
        <button type="button">{{ tab.label }}</button>
      }
    </tui-segmented>

    <ul class="glossary-list">
      @for (item of itemsForActiveTab(); track item.term) {
        <li class="glossary-item">
          <strong class="tui-text_body-m">{{ item.term }}</strong>
          <p class="tui-text_body-s muted">{{ item.meaning }}</p>
        </li>
      }
    </ul>
  </aside>
</div>
