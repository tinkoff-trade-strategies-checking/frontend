name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      # npm 10.9 падает на разрешении peer-зависимостей Taiga UI — ставим npm из packageManager.
      - name: Зависимости
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Формат
        run: npm run format:check
      - name: Линтер
        run: npm run lint
      - name: Копия OpenAPI совпадает с backend
        run: npm run api:check
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Сборка на заглушках (демо)
        run: npm run build:stub

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      # npm 10.9 падает на разрешении peer-зависимостей Taiga UI — ставим npm из packageManager.
      - name: Зависимости
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium
      - name: Сквозные тесты (e2e)
        run: npm run e2e
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Ссылки на тесты в documentation/invariants.md: переименованный тест frontend роняет PR (home#29).
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: tinkoff-trade-strategies-checking/documentation
          path: documentation
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: tinkoff-trade-strategies-checking/core
          path: core
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: tinkoff-trade-strategies-checking/backend
          path: backend
          fetch-depth: 1
      - name: Проверка ссылок invariants.md
        run: python3 documentation/scripts/check-invariants.py --core core --frontend frontend --backend backend

  # Размер PR в режиме наблюдения: не падает, только предупреждение (home#29).
  pr-size:
    if: github.event_name == 'pull_request'
    uses: tinkoff-trade-strategies-checking/.github/.github/workflows/pr-size.yml@main
