name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      # npm 10.9 падает на разрешении peer-зависимостей Taiga UI — ставим npm из packageManager.
      - name: Зависимости
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Формат
        run: npm run format:check
      - name: Линтер
        run: npm run lint
      - name: Копия OpenAPI совпадает с backend
        run: npm run api:check
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      # npm 10.9 падает на разрешении peer-зависимостей Taiga UI — ставим npm из packageManager.
      - name: Зависимости
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium
      - name: Сквозные тесты (e2e)
        run: npm run e2e
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
